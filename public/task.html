<!-- public/task.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Red Folder ATL • Task</title>

  <link rel="stylesheet" href="./style.css" />

  <!-- PDF libraries (match what app.js expects) -->
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
</head>

<body data-page="task">
  <header class="topbar">
    <div class="topLeft">
      <a class="iconBtn" id="backLink" href="./index.html" aria-label="Back">←</a>
      <div>
        <div class="brandTitle">Red Folder ATL</div>
        <div class="brandSub" id="taskBreadcrumb">Checklist • Task</div>
      </div>
    </div>

    <div class="topRight">
      <a class="pillBtn" href="./history.html">History</a>
    </div>
  </header>

  <main class="wrap">
    <section class="card">
      <div class="cardHead">
        <div style="min-width:0;">
          <h1 class="h1" id="taskTitle">Task</h1>
          <p class="sub" id="taskDesc">Complete the task and download the PDF.</p>
        </div>

        <div class="actions">
          <button class="btn btnAlt" type="button" id="naTaskBtn">Mark N/A</button>
          <button class="btn btnAlt" type="button" id="saveTaskBtn">Save</button>
          <button class="btn" type="button" id="pdfTaskBtn">Download PDF</button>
        </div>
      </div>

      <div id="taskMsg" class="msg" style="display:none;"></div>

      <div id="taskBody"></div>
    </section>

    <footer class="foot">
      <span id="buildTag"></span>
    </footer>
  </main>

  <script src="./app.js"></script>
</body>
</html>
