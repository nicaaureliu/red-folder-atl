<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Red Folder ATL • Pack</title>

  <link rel="stylesheet" href="./style.css" />

  <!-- PDF libs -->
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>

  <script src="./app.js" defer></script>
</head>

<body data-page="form">
  <header class="topbar">
    <div class="brand">
      <a id="backLink" class="linkBtn" href="./index.html">Back</a>
      <div>
        <div class="brandTitle">Red Folder ATL</div>
        <div id="formSubtitle" class="brandSub"></div>
      </div>
    </div>

    <nav class="topActions">
      <a class="linkBtn" href="./history.html">History</a>
    </nav>
  </header>

  <main class="wrap">
    <section class="card">
      <div class="rowBetween">
        <div>
          <h1 id="formTitle" class="h1">Pack</h1>
          <p id="formDesc" class="p"></p>
        </div>
        <div class="rightStack">
          <button id="downloadPackBtn" class="btnAlt" type="button">Download Pack PDF</button>
          <button id="submitPackBtn" class="btn" type="button">Submit Pack</button>
        </div>
      </div>

      <div id="errorBox" class="errorBox" style="display:none;"></div>

      <div class="metaGrid">
        <div class="field">
          <label>Project</label>
          <input id="meta_project" type="text" placeholder="e.g., Hinckley W1.xxx" />
        </div>

        <div class="field">
          <label>Project No.</label>
          <input id="meta_projectNo" type="text" placeholder="Optional" />
        </div>

        <div class="field">
          <label>Site</label>
          <input id="meta_site" type="text" placeholder="e.g., W1.035" />
        </div>

        <div class="field">
          <label>Supervisor</label>
          <input id="meta_supervisor" type="text" placeholder="Name" />
        </div>

        <div class="field">
          <label id="periodLabel">Date</label>
          <input id="meta_period" type="date" />
        </div>

        <div class="field">
          <label>Completed by</label>
          <input id="meta_completedBy" type="text" placeholder="Name" />
        </div>
      </div>
    </section>

    <section class="card">
      <div class="rowBetween">
        <h2 class="h2">Checks in this pack</h2>
        <div id="packProgress" class="muted"></div>
      </div>

      <div id="itemsWrap" class="taskList"></div>
    </section>

    <footer class="footer">
      <span id="buildTag" class="muted"></span>
    </footer>
  </main>
</body>
</html>
