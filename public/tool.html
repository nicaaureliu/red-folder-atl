<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Form</title>

  <style>
    :root{
      --bg:#f6f7f9;
      --panel:#ffffff;
      --text:#111111;
      --muted:#6b7280;
      --line:#e5e7eb;
      --yellow:#ffd600;
      --radius:22px;
      --btn:#111;
      --btnText:#fff;
    }
    *{ box-sizing:border-box; }
    html, body{ width:100%; max-width:100%; overflow-x:hidden; }

    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap{ max-width: 980px; margin: 18px auto; padding: 0 14px; }
    .shell{
      border: 1px solid #e8eaee;
      border-radius: 26px;
      padding: 10px;
      box-shadow: 0 6px 18px rgba(0,0,0,.04);
      background: transparent;
    }
    .card{
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
    }

    h1{ margin:0 0 6px; font-size: 22px; font-weight: 900; }
    .sub{ margin:0 0 14px; color: var(--muted); font-weight: 700; font-size: 13px; }

    .row{ display:flex; gap:12px; flex-wrap:wrap; }
    .col{ flex: 1 1 240px; min-width: 240px; }

    label{ display:block; font-size:12px; font-weight:800; color:#111; margin: 10px 0 6px; }
    input, select, textarea{
      width:100%;
      border:1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
      background:#fff;
    }
    textarea{ min-height: 92px; resize: vertical; }

    .actions{
      margin-top: 14px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:space-between;
    }
    .leftActions{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }

    .btn{
      display:inline-block;
      border-radius: 999px;
      padding: 10px 16px;
      font-weight: 900;
      text-decoration:none;
      cursor:pointer;
      border: 1px solid rgba(0,0,0,.10);
      box-shadow: 0 2px 0 rgba(0,0,0,.10);
      user-select:none;
      background: var(--btn);
      color: var(--btnText);
    }
    .btn:active{ transform: translateY(1px); }

    .btnYellow{
      background: var(--yellow);
      border-color: #caa900;
      color:#111;
    }
    .btnGhost{
      background:#fff;
      color:#111;
      border:1px solid var(--line);
      box-shadow:none;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 8px 10px;
      border-radius: 999px;
      border:1px solid var(--line);
      background:#fff;
      color: var(--muted);
      font-weight: 800;
      font-size: 12px;
    }

    .grid3{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap:10px;
    }
    .checkBox{
      display:flex;
      align-items:center;
      gap:10px;
      border:1px solid var(--line);
      border-radius: 14px;
      padding: 10px 12px;
      background:#fff;
      font-weight: 800;
      font-size: 13px;
    }
    .checkBox input{ width:18px; height:18px; }

    .sectionTitle{
      margin-top: 14px;
      font-weight: 900;
      font-size: 14px;
      color:#111;
    }

    .attRow{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:flex-end;
      margin-top: 10px;
      padding: 10px;
      border:1px solid var(--line);
      border-radius: 14px;
      background:#fff;
    }
    .attRow .small{ flex: 1 1 220px; min-width:220px; }
    .attRow .mini{ flex: 1 1 160px; min-width:160px; }
    .attRow .sigCol{ flex: 1 1 240px; min-width:240px; }

    .sigPreview{
      margin-top: 6px;
      width: 100%;
      height: 54px;
      border: 1px dashed var(--line);
      border-radius: 12px;
      background: #fafafa;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }
    .sigPreview img{
      width: 100%;
      height: 100%;
      object-fit: contain;
      background:#fff;
    }
    .sigPreview span{
      color: var(--muted);
      font-weight: 800;
      font-size: 12px;
    }

    .danger{
      background:#fff;
      border:1px solid #fecaca;
      color:#7f1d1d;
      box-shadow:none;
    }

    .note{
      margin-top:10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.35;
    }

    .warn{
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid #fde68a;
      background: #fffbeb;
      color:#92400e;
      font-weight: 800;
      font-size: 13px;
      display:none;
    }

    /* Signature modal */
    .modalOverlay{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.40);
      display:none;
      align-items:center;
      justify-content:center;
      padding: 14px;
      z-index: 50;
    }
    .modal{
      width: min(760px, 100%);
      background: #fff;
      border-radius: 18px;
      border: 1px solid var(--line);
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
      overflow:hidden;
    }
    .modalHead{
      padding: 14px 14px 10px;
      border-bottom: 1px solid var(--line);
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
    }
    .modalHead strong{ font-size: 14px; }
    .modalBody{ padding: 12px 14px; }
    .sigCanvasWrap{
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow:hidden;
      background: #fff;
      touch-action: none; /* important for mobile drawing */
    }
    canvas{
      width:100%;
      height: 240px;
      display:block;
      background:#fff;
    }
    .modalFoot{
      padding: 12px 14px 14px;
      border-top: 1px solid var(--line);
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:space-between;
      align-items:center;
    }
    .modalFoot .leftActions{ justify-content:flex-start; }
    .modalHelp{
      color: var(--muted);
      font-weight: 800;
      font-size: 12px;
    }

    @media (max-width: 860px){
      .grid3{ grid-template-columns: 1fr; }
      .col{ min-width: 100%; }
      .actions{ justify-content:flex-start; }
      canvas{ height: 220px; }
    }
  </style>

  <!-- pdf-lib (client-side PDF editing) -->
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>

<body>
  <div class="wrap">
    <div class="shell">
      <div id="app" class="card"></div>
    </div>
  </div>

  <!-- Signature Modal -->
  <div id="sigOverlay" class="modalOverlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-label="Signature">
      <div class="modalHead">
        <strong id="sigTitle">Signature</strong>
        <button id="sigCloseTop" class="btn btnGhost" type="button">Close</button>
      </div>

      <div class="modalBody">
        <div class="sigCanvasWrap">
          <canvas id="sigCanvas"></canvas>
        </div>
      </div>

      <div class="modalFoot">
        <div class="leftActions">
          <button id="sigClear" class="btn btnGhost" type="button">Clear</button>
          <button id="sigCancel" class="btn btnGhost" type="button">Cancel</button>
        </div>

        <div class="leftActions">
          <span class="modalHelp">Draw with finger/mouse. Then Save.</span>
          <button id="sigSave" class="btn btnYellow" type="button">Save signature</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const $ = (q) => document.querySelector(q);
    const el = (tag, attrs={}, children=[]) => {
      const n = document.createElement(tag);
      Object.entries(attrs).forEach(([k,v])=>{
        if(k === "class") n.className = v;
        else if(k === "html") n.innerHTML = v;
        else if(k.startsWith("on") && typeof v === "function") n.addEventListener(k.substring(2), v);
        else n.setAttribute(k, v);
      });
      children.forEach(c => n.appendChild(typeof c === "string" ? document.createTextNode(c) : c));
      return n;
    };

    const params = new URLSearchParams(location.search);
    const t = (params.get("t") || "Form").trim();
    document.title = t;

    // ===== Signature storage: attendeeId -> dataURL(PNG)
    const sigStore = new Map();

    const makeId = () => {
      return "id_" + Math.random().toString(16).slice(2) + "_" + Date.now().toString(16);
    };

    // ===== Helpers =====
    const pad2 = (n) => String(n).padStart(2,"0");
    const toDDMMYYYY = (iso) => {
      if(!iso || !iso.includes("-")) return iso || "";
      const [y,m,d] = iso.split("-");
      return `${pad2(d)}\/${pad2(m)}\/${y}`;
    };
    const todayISO = () => {
      const d = new Date();
      const y = d.getFullYear();
      const m = pad2(d.getMonth()+1);
      const day = pad2(d.getDate());
      return `${y}-${m}-${day}`;
    };

    // ===== Placeholder for non-Daily Brief tools =====
    function renderPlaceholder(title){
      const app = $("#app");
      app.innerHTML = "";
      app.appendChild(el("h1",{},[title]));
      app.appendChild(el("div",{class:"sub"},["This is a placeholder page. Next step: we connect this to the actual form/PDF and save/export logic."]));
      app.appendChild(el("div",{class:"actions"},[
        el("div",{class:"leftActions"},[
          el("a",{class:"btn btnYellow", href:"daily.html"},["Back"])
        ])
      ]));
    }

    // ===== Signature Modal (canvas drawing) =====
    const SigModal = (() => {
      const overlay = $("#sigOverlay");
      const canvas = $("#sigCanvas");
      const titleEl = $("#sigTitle");
      const btnClear = $("#sigClear");
      const btnCancel = $("#sigCancel");
      const btnSave = $("#sigSave");
      const btnCloseTop = $("#sigCloseTop");

      let ctx, drawing = false, hasInk = false;
      let currentAttId = null;
      let onSavedCb = null;

      const resizeCanvas = () => {
        // Keep high DPI crisp
        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.floor(rect.width * dpr);
        canvas.height = Math.floor(rect.height * dpr);
        ctx = canvas.getContext("2d");
        ctx.scale(dpr, dpr);
        clearCanvas();
      };

      const clearCanvas = () => {
        if(!ctx) return;
        const rect = canvas.getBoundingClientRect();
        ctx.clearRect(0,0,rect.width,rect.height);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0,0,rect.width,rect.height);
        ctx.strokeStyle = "#000000";
        ctx.lineWidth = 2.4;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        hasInk = false;
      };

      const getPos = (evt) => {
        const rect = canvas.getBoundingClientRect();
        const x = (evt.clientX - rect.left);
        const y = (evt.clientY - rect.top);
        return { x, y };
      };

      const start = (evt) => {
        evt.preventDefault();
        drawing = true;
        const p = getPos(evt);
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
      };

      const move = (evt) => {
        if(!drawing) return;
        evt.preventDefault();
        const p = getPos(evt);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
        hasInk = true;
      };

      const end = (evt) => {
        if(!drawing) return;
        evt.preventDefault();
        drawing = false;
      };

      // Pointer events (best for mobile+desktop)
      canvas.addEventListener("pointerdown", start);
      canvas.addEventListener("pointermove", move);
      window.addEventListener("pointerup", end);
      window.addEventListener("pointercancel", end);

      btnClear.addEventListener("click", clearCanvas);

      const close = () => {
        overlay.style.display = "none";
        overlay.setAttribute("aria-hidden","true");
        currentAttId = null;
        onSavedCb = null;
      };

      btnCancel.addEventListener("click", close);
      btnCloseTop.addEventListener("click", close);

      btnSave.addEventListener("click", () => {
        if(!currentAttId) return;
        if(!hasInk){
          alert("Please sign first (draw something), then Save.");
          return;
        }
        // Export PNG
        const dataUrl = canvas.toDataURL("image/png");
        sigStore.set(currentAttId, dataUrl);
        if(typeof onSavedCb === "function") onSavedCb(currentAttId, dataUrl);
        close();
      });

      // Resize when shown / window changes
      window.addEventListener("resize", () => {
        if(overlay.style.display === "flex") resizeCanvas();
      });

      const open = (attId, attName, cb) => {
        currentAttId = attId;
        onSavedCb = cb;
        titleEl.textContent = attName ? `Signature: ${attName}` : "Signature";
        overlay.style.display = "flex";
        overlay.setAttribute("aria-hidden","false");
        // Allow layout to settle before resize
        setTimeout(resizeCanvas, 50);
      };

      return { open };
    })();

    // ===== Daily Brief form =====
    function renderDailyBrief(){
      const app = $("#app");
      app.innerHTML = "";

      const warn = el("div",{class:"warn", id:"warnBox"},["Template PDF not found. Put it at public/templates/daily-briefing.pdf"]);

      const f = {
        projectTitle: "",
        siteLocation: "",
        workLocation: "",
        projectNo: "",
        brieferName: "",
        dateISO: todayISO(),
        jobTitle: "",
        prevPlanned: "Yes",
        prevConcerns: "",
        todayPlanned: "",
        covered: "Yes",
        controls: "Yes",
        ppe: "Yes",
        points: {
          confined:false, emergency:false, lifting:false, permits:false, plant:false, safetyPlanning:false,
          barriers:false, clearAccess:false, methodStatements:false, suitablePPE:false, trenchCollapse:false, welfare:false,
          coshh:false, fire:false, materials:false, competence:false, cables:false, trips:false
        },
        attendees: [
          { id: makeId(), name:"", dateISO: todayISO() },
        ]
      };

      const title = el("h1",{},["Daily Brief"]);
      const sub = el("div",{class:"sub"},["Fill in the briefing, sign each attendee row, then press Download PDF."]);

      const headerRow1 = el("div",{class:"row"},[
        el("div",{class:"col"},[
          el("label",{},["Project title"]),
          el("input",{id:"projectTitle", placeholder:"e.g. Sizewell C", value:f.projectTitle})
        ]),
        el("div",{class:"col"},[
          el("label",{},["Site location"]),
          el("input",{id:"siteLocation", placeholder:"e.g. Sizewell", value:f.siteLocation})
        ]),
        el("div",{class:"col"},[
          el("label",{},["Work location"]),
          el("input",{id:"workLocation", placeholder:"e.g. Cofferdams", value:f.workLocation})
        ]),
        el("div",{class:"col"},[
          el("label",{},["Project no"]),
          el("input",{id:"projectNo", placeholder:"e.g. 836", value:f.projectNo})
        ]),
      ]);

      const headerRow2 = el("div",{class:"row"},[
        el("div",{class:"col"},[
          el("label",{},["Name of person giving briefing"]),
          el("input",{id:"brieferName", placeholder:"e.g. Aureliu Nica", value:f.brieferName})
        ]),
        el("div",{class:"col"},[
          el("label",{},["Date"]),
          el("input",{id:"dateISO", type:"date", value:f.dateISO})
        ]),
        el("div",{class:"col"},[
          el("label",{},["Job title"]),
          el("input",{id:"jobTitle", placeholder:"e.g. Site Agent", value:f.jobTitle})
        ]),
        el("div",{class:"col"},[
          el("label",{},["Did previous day go as planned?"]),
          el("select",{id:"prevPlanned"},[
            el("option",{value:"Yes"},["Yes"]),
            el("option",{value:"No"},["No"])
          ])
        ]),
      ]);

      const prevConcerns = el("div",{class:"row"},[
        el("div",{class:"col"},[
          el("label",{},["Any concerns from the previous day?"]),
          el("textarea",{id:"prevConcerns", placeholder:"Write any concerns / issues / lessons learned..."},[])
        ]),
        el("div",{class:"col"},[
          el("label",{},["Today's planned activities briefing"]),
          el("textarea",{id:"todayPlanned", placeholder:"What are we doing today? Sequence, key risks, controls, etc..."},[])
        ]),
      ]);

      // Points discussed
      const pointsTitle = el("div",{class:"sectionTitle"},["Points discussed for today’s operation"]);
      const pointsGrid = el("div",{class:"grid3"},[
        el("div",{},[
          mkCheck("confined","Confined Spaces / Areas"),
          mkCheck("emergency","Emergency Procedures"),
          mkCheck("lifting","Lifting Equipment – Chains / Slings"),
          mkCheck("permits","Permits to Work"),
          mkCheck("plant","Plant & Equipment"),
          mkCheck("safetyPlanning","Safety Planning"),
        ]),
        el("div",{},[
          mkCheck("barriers","Barriers / Edge Protection"),
          mkCheck("clearAccess","Clear Access Ways"),
          mkCheck("methodStatements","Method Statements / Risk Assessments"),
          mkCheck("suitablePPE","Suitable PPE"),
          mkCheck("trenchCollapse","Trench Collapse"),
          mkCheck("welfare","Welfare Facilities"),
        ]),
        el("div",{},[
          mkCheck("coshh","COSHH Assessments"),
          mkCheck("fire","Fire Precautions"),
          mkCheck("materials","Materials"),
          mkCheck("competence","Operative Experience / Competence"),
          mkCheck("cables","Overhead / Underground Cable Strike"),
          mkCheck("trips","Trips / Falls"),
        ])
      ]);

      // Confirmations
      const bottomTitle = el("div",{class:"sectionTitle"},["Confirmations"]);
      const bottomRow = el("div",{class:"row"},[
        el("div",{class:"col"},[
          el("label",{},["Are all today’s activities covered by the procedure / MS / RA / WI?"]),
          el("select",{id:"covered"},[
            el("option",{value:"Yes"},["Yes"]),
            el("option",{value:"No"},["No"]),
          ])
        ]),
        el("div",{class:"col"},[
          el("label",{},["Are all control measures in place?"]),
          el("select",{id:"controls"},[
            el("option",{value:"Yes"},["Yes"]),
            el("option",{value:"No"},["No"]),
          ])
        ]),
        el("div",{class:"col"},[
          el("label",{},["Are all operatives compliant with PPE requirements?"]),
          el("select",{id:"ppe"},[
            el("option",{value:"Yes"},["Yes"]),
            el("option",{value:"No"},["No"]),
          ])
        ]),
      ]);

      // Attendees
      const attTitle = el("div",{class:"sectionTitle"},["Attendees (sign-up sheet)"]);
      const attWrap = el("div",{id:"attWrap"},[]);
      const addAttBtn = el("button",{class:"btn btnGhost", type:"button", onclick:()=>addAttendee(attWrap)},["+ Add attendee"]);

      const note = el("div",{class:"note"},[
        "This embeds each attendee signature into the SIGNATURE column in the PDF. ",
        "Pages 2–3 support up to 36 attendees total."
      ]);

      // Actions
      const actions = el("div",{class:"actions"},[
        el("div",{class:"leftActions"},[
          el("a",{class:"btn btnYellow", href:"daily.html"},["Back"]),
          el("span",{class:"pill", id:"attCountPill"},["Attendees: 0"])
        ]),
        el("div",{class:"leftActions"},[
          el("button",{class:"btn", type:"button", id:"downloadBtn", onclick: async()=> {
            $("#warnBox").style.display="none";
            await generateDailyBriefPDF(readForm(f, attWrap));
          }},["Download PDF"])
        ])
      ]);

      app.appendChild(title);
      app.appendChild(sub);
      app.appendChild(warn);
      app.appendChild(headerRow1);
      app.appendChild(headerRow2);
      app.appendChild(prevConcerns);
      app.appendChild(pointsTitle);
      app.appendChild(pointsGrid);
      app.appendChild(bottomTitle);
      app.appendChild(bottomRow);
      app.appendChild(attTitle);
      app.appendChild(attWrap);
      app.appendChild(el("div",{class:"actions"},[
        el("div",{class:"leftActions"},[addAttBtn]),
      ]));
      app.appendChild(note);
      app.appendChild(actions);

      // defaults
      $("#prevPlanned").value = f.prevPlanned;
      $("#covered").value = f.covered;
      $("#controls").value = f.controls;
      $("#ppe").value = f.ppe;

      $("#prevConcerns").value = f.prevConcerns;
      $("#todayPlanned").value = f.todayPlanned;

      // build attendee UI
      rebuildAttendees(attWrap, f.attendees);
      updateAttendeeCount(attWrap);

      function mkCheck(key,label){
        const id = "pt_" + key;
        return el("label",{class:"checkBox", for:id},[
          el("input",{type:"checkbox", id}),
          el("span",{},[label])
        ]);
      }

      function addAttendee(container){
        const list = collectAttendees(container);
        list.push({ id: makeId(), name:"", dateISO: todayISO() });
        rebuildAttendees(container, list);
        updateAttendeeCount(container);
      }

      function rebuildAttendees(container, list){
        container.innerHTML = "";

        list.forEach((a, idx)=>{
          const attId = a.id;
          const sigUrl = sigStore.get(attId) || "";

          const preview = el("div",{class:"sigPreview", "data-sig-prev":attId},[
            sigUrl ? el("img",{src:sigUrl, alt:"Signature preview"}) : el("span",{},["No signature yet"])
          ]);

          const signBtn = el("button",{
            class:"btn btnGhost",
            type:"button",
            onclick:()=>{
              const nameNow = (container.querySelector(`input[data-att-name="${attId}"]`)?.value || "").trim();
              SigModal.open(attId, nameNow || `Attendee ${idx+1}`, (id, url)=>{
                // update preview
                const box = container.querySelector(`[data-sig-prev="${id}"]`);
                if(box){
                  box.innerHTML = "";
                  box.appendChild(el("img",{src:url, alt:"Signature preview"}));
                }
              });
            }
          },["Sign"]);

          const clearSigBtn = el("button",{
            class:"btn danger",
            type:"button",
            onclick:()=>{
              sigStore.delete(attId);
              const box = container.querySelector(`[data-sig-prev="${attId}"]`);
              if(box){
                box.innerHTML = "";
                box.appendChild(el("span",{},["No signature yet"]));
              }
            }
          },["Clear sig"]);

          const row = el("div",{class:"attRow"},[
            el("div",{class:"small"},[
              el("label",{},["Name"]),
              el("input",{type:"text", value:a.name, placeholder:"e.g. John Smith", "data-att-name":attId})
            ]),
            el("div",{class:"mini"},[
              el("label",{},["Date"]),
              el("input",{type:"date", value:a.dateISO, "data-att-date":attId})
            ]),
            el("div",{class:"sigCol"},[
              el("label",{},["Signature"]),
              preview,
              el("div",{class:"row", style:"margin-top:8px; gap:8px;"},[
                signBtn,
                clearSigBtn
              ])
            ]),
            el("div",{class:"mini"},[
              el("label",{},["Remove"]),
              el("button",{class:"btn danger", type:"button", onclick:()=>{
                const now = collectAttendees(container);
                const i = now.findIndex(x=>x.id===attId);
                if(i>=0) now.splice(i,1);
                sigStore.delete(attId);
                if(now.length===0) now.push({ id: makeId(), name:"", dateISO: todayISO() });
                rebuildAttendees(container, now);
                updateAttendeeCount(container);
              }},["Delete"])
            ]),
          ]);

          container.appendChild(row);
        });

        // live updates
        container.querySelectorAll("input[type='text']").forEach(inp=>{
          inp.addEventListener("input", ()=> updateAttendeeCount(container));
        });
      }

      function collectAttendees(container){
        const rows = [...container.querySelectorAll(".attRow")];
        return rows.map((r)=> {
          const nameInp = r.querySelector("input[type='text']");
          const dateInp = r.querySelector("input[type='date']");
          const attId = nameInp.getAttribute("data-att-name");
          const name = (nameInp.value || "").trim();
          const dateISO = (dateInp.value || todayISO());
          const signature = sigStore.get(attId) || "";
          return { id: attId, name, dateISO, signature };
        });
      }

      function updateAttendeeCount(container){
        const list = collectAttendees(container);
        const count = list.filter(x => (x.name||"").trim().length>0).length;
        $("#attCountPill").textContent = `Attendees: ${count}`;
      }

      function readForm(state, container){
        state.projectTitle = $("#projectTitle").value.trim();
        state.siteLocation = $("#siteLocation").value.trim();
        state.workLocation = $("#workLocation").value.trim();
        state.projectNo = $("#projectNo").value.trim();
        state.brieferName = $("#brieferName").value.trim();
        state.dateISO = $("#dateISO").value || todayISO();
        state.jobTitle = $("#jobTitle").value.trim();
        state.prevPlanned = $("#prevPlanned").value;
        state.prevConcerns = $("#prevConcerns").value.trim();
        state.todayPlanned = $("#todayPlanned").value.trim();

        Object.keys(state.points).forEach(k=>{
          const box = document.getElementById("pt_"+k);
          state.points[k] = !!(box && box.checked);
        });

        state.covered = $("#covered").value;
        state.controls = $("#controls").value;
        state.ppe = $("#ppe").value;

        state.attendees = collectAttendees(container);
        return state;
      }
    }

    // ===== PDF generation: Daily Brief =====
    async function generateDailyBriefPDF(data){
      const { PDFDocument, StandardFonts, rgb } = PDFLib;

      const TEMPLATE_URL = "templates/daily-briefing.pdf";
      let templateBytes;
      try{
        const res = await fetch(TEMPLATE_URL, { cache:"no-store" });
        if(!res.ok) throw new Error("Template fetch failed: " + res.status);
        templateBytes = await res.arrayBuffer();
      }catch(e){
        const w = $("#warnBox");
        w.style.display = "block";
        w.textContent = "Template PDF not found. Put it at public/templates/daily-briefing.pdf";
        return;
      }

      const pdfDoc = await PDFDocument.load(templateBytes);
      const helv = await pdfDoc.embedFont(StandardFonts.Helvetica);
      const zapf = await pdfDoc.embedFont(StandardFonts.ZapfDingbats);

      const pages = pdfDoc.getPages();
      const page1 = pages[0];

      const WHITE = rgb(1,1,1);

      const cover = (page, x, y, w, h) => {
        page.drawRectangle({ x, y, width:w, height:h, color: WHITE });
      };

      const drawText = (page, text, x, y, size=10) => {
        if(!text) return;
        page.drawText(String(text), { x, y, size, font: helv, color: rgb(0,0,0) });
      };

      const wrapLines = (font, text, size, maxWidth) => {
        const words = String(text || "").replace(/\r/g,"").split(/\s+/).filter(Boolean);
        const lines = [];
        let line = "";
        for(const w of words){
          const test = line ? (line + " " + w) : w;
          const width = font.widthOfTextAtSize(test, size);
          if(width <= maxWidth){
            line = test;
          }else{
            if(line) lines.push(line);
            line = w;
          }
        }
        if(line) lines.push(line);
        return lines;
      };

      const drawWrappedFromTop = (page, text, x, topY, maxWidth, lineHeight=12, size=10, maxLines=20) => {
        const lines = wrapLines(helv, text, size, maxWidth).slice(0, maxLines);
        let y = topY;
        for(const ln of lines){
          page.drawText(ln, { x, y, size, font: helv, color: rgb(0,0,0) });
          y -= lineHeight;
        }
      };

      const drawYesNo = (page, value, x, y, boxW=20, boxH=14) => {
        cover(page, x-3, y-2, boxW, boxH);
        if(value === "Yes"){
          page.drawText("4", { x, y, size: 12, font: zapf, color: rgb(0,0,0) });
        }else{
          page.drawText("X", { x, y, size: 10, font: helv, color: rgb(0,0,0) });
        }
      };

      // ---- Page 1 coords
      const p1 = {
        projectTitle: { x:185, y:656.5, w:265, h:14 },
        siteLocation:  { x:492, y:648.9, w:105, h:14 },
        workLocation:  { x:185, y:622.5, w:265, h:14 },
        projectNo:      { x:502, y:621.8, w:95,  h:14 },
        brieferName:   { x:185, y:592.1, w:265, h:14 },
        date:          { x:486, y:592.0, w:120, h:14 },
        jobTitle:      { x:185, y:571.0, w:265, h:14 },
        numPersons:    { x:486, y:571.0, w:120, h:14 },
        prevPlanned:   { x:530, y:548.0, w:40, h:16 },
        concerns: { x:90, topY: 482, w:460, h:60 },
        planned:  { x:90, topY: 394, w:460, h:120 },
        covered:  { x:518, y:140.9 },
        controls: { x:518, y:94.1  },
        ppe:      { x:518, y:44.5  },
      };

      const ddmmyyyy = toDDMMYYYY(data.dateISO);
      const attendeesAll = (data.attendees || [])
        .map(a => ({
          id: a.id,
          name: (a.name || "").trim(),
          dateISO: (a.dateISO || data.dateISO || todayISO()),
          signature: (a.signature || "")
        }))
        .filter(a => a.name.length > 0);

      const attendeesCount = attendeesAll.length;

      cover(page1, p1.projectTitle.x-2, p1.projectTitle.y-2, p1.projectTitle.w, p1.projectTitle.h);
      drawText(page1, data.projectTitle, p1.projectTitle.x, p1.projectTitle.y, 10);

      cover(page1, p1.siteLocation.x-2, p1.siteLocation.y-2, p1.siteLocation.w, p1.siteLocation.h);
      drawText(page1, data.siteLocation, p1.siteLocation.x, p1.siteLocation.y, 10);

      cover(page1, p1.workLocation.x-2, p1.workLocation.y-2, p1.workLocation.w, p1.workLocation.h);
      drawText(page1, data.workLocation, p1.workLocation.x, p1.workLocation.y, 10);

      cover(page1, p1.projectNo.x-2, p1.projectNo.y-2, p1.projectNo.w, p1.projectNo.h);
      drawText(page1, data.projectNo, p1.projectNo.x, p1.projectNo.y, 10);

      cover(page1, p1.brieferName.x-2, p1.brieferName.y-2, p1.brieferName.w, p1.brieferName.h);
      drawText(page1, data.brieferName, p1.brieferName.x, p1.brieferName.y, 10);

      cover(page1, p1.date.x-2, p1.date.y-2, p1.date.w, p1.date.h);
      drawText(page1, ddmmyyyy, p1.date.x, p1.date.y, 10);

      cover(page1, p1.jobTitle.x-2, p1.jobTitle.y-2, p1.jobTitle.w, p1.jobTitle.h);
      drawText(page1, data.jobTitle, p1.jobTitle.x, p1.jobTitle.y, 10);

      cover(page1, p1.numPersons.x-2, p1.numPersons.y-2, p1.numPersons.w, p1.numPersons.h);
      drawText(page1, String(attendeesCount || ""), p1.numPersons.x, p1.numPersons.y, 10);

      drawYesNo(page1, data.prevPlanned, p1.prevPlanned.x, p1.prevPlanned.y, 34, 16);

      cover(page1, p1.concerns.x-5, p1.concerns.topY-60, p1.concerns.w+10, p1.concerns.h);
      drawWrappedFromTop(page1, data.prevConcerns, p1.concerns.x, p1.concerns.topY, p1.concerns.w, 12, 10, 6);

      cover(page1, p1.planned.x-5, p1.planned.topY-120, p1.planned.w+10, p1.planned.h);
      drawWrappedFromTop(page1, data.todayPlanned, p1.planned.x, p1.planned.topY, p1.planned.w, 12, 10, 10);

      // Points discussed tick grid
      const rowY = [252.37, 241.28, 230.58, 219.75, 208.40, 197.57];
      const colX = [219.04, 380.11, 539.13];
      const pointsMatrix = [
        ["confined","barriers","coshh"],
        ["emergency","clearAccess","fire"],
        ["lifting","methodStatements","materials"],
        ["permits","suitablePPE","competence"],
        ["plant","trenchCollapse","cables"],
        ["safetyPlanning","welfare","trips"],
      ];

      for(let r=0;r<6;r++){
        for(let c=0;c<3;c++){
          const key = pointsMatrix[r][c];
          const x = colX[c], y = rowY[r];
          cover(page1, x-2, y-2, 14, 14);
          if(data.points && data.points[key]){
            page1.drawText("4", { x, y, size: 12, font: zapf, color: rgb(0,0,0) });
          }
        }
      }

      drawYesNo(page1, data.covered,  p1.covered.x,  p1.covered.y,  20, 14);
      drawYesNo(page1, data.controls, p1.controls.x, p1.controls.y, 20, 14);
      drawYesNo(page1, data.ppe,      p1.ppe.x,      p1.ppe.y,      20, 14);

      // ---- Sign-up sheets (pages 2 & 3): Name + Date + Signature image
      const page2 = pages[1];
      const page3 = pages[2];

      const page2Rows = [
        587.96, 557.96, 527.87, 497.87, 467.33, 437.87, 407.96, 377.63, 347.63,
        317.99, 287.28, 257.99, 224.89, 189.51, 154.50, 120.19, 84.47, 49.23
      ];
      const page3Rows = [
        676.29, 641.50, 605.32, 570.47, 535.37, 500.51, 464.67, 429.59, 394.96,
        359.88, 324.58, 288.70, 253.60, 219.27, 183.43, 148.48, 113.65, 78.55
      ];

      const nameX = 88;
      const dateX = 294;

      // Signature box area (calibrated)
      const sigBox = { x:365, w:210, h:18, yOffset:-12, padX:6, padY:2 };

      const fitInto = (imgW, imgH, maxW, maxH) => {
        const r = Math.min(maxW / imgW, maxH / imgH);
        return { w: imgW * r, h: imgH * r };
      };

      async function drawSignatureIfAny(page, sigDataUrl, rowY){
        if(!sigDataUrl) return;

        // Clear the cell area so the tiny "SIGN" text disappears
        cover(page, sigBox.x, rowY + sigBox.yOffset, sigBox.w, sigBox.h);

        // Convert dataURL -> bytes
        const b64 = sigDataUrl.split(",")[1] || "";
        if(!b64) return;
        const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));

        const img = await pdfDoc.embedPng(bytes);
        const maxW = sigBox.w - (sigBox.padX * 2);
        const maxH = sigBox.h - (sigBox.padY * 2);
        const s = fitInto(img.width, img.height, maxW, maxH);

        const x = sigBox.x + sigBox.padX;
        const y = (rowY + sigBox.yOffset) + sigBox.padY + ((maxH - s.h) / 2);

        page.drawImage(img, { x, y, width: s.w, height: s.h });
      }

      function fillTextCells(page, a, rowY){
        // clear inside cells (avoid borders)
        cover(page, nameX-5, rowY-3, 190, 16);
        cover(page, dateX-5, rowY-3, 90, 16);

        page.drawText(a.name, { x:nameX, y:rowY, size:10, font: helv, color: rgb(0,0,0) });
        page.drawText(toDDMMYYYY(a.dateISO), { x:dateX, y:rowY, size:10, font: helv, color: rgb(0,0,0) });
      }

      async function fillAttPage(page, rowsY, startIndex){
        let idx = startIndex;
        for(let i=0;i<rowsY.length;i++){
          const a = attendeesAll[idx];
          const y = rowsY[i];

          // clear signature cell area even if no signature, to remove placeholder "SIGN"
          cover(page, sigBox.x, y + sigBox.yOffset, sigBox.w, sigBox.h);

          if(a){
            fillTextCells(page, a, y);
            await drawSignatureIfAny(page, a.signature, y);
            idx++;
          }
        }
        return idx;
      }

      let next = await fillAttPage(page2, page2Rows, 0);
      await fillAttPage(page3, page3Rows, next);

      // Save + download
      const outBytes = await pdfDoc.save();
      const blob = new Blob([outBytes], { type: "application/pdf" });
      const url = URL.createObjectURL(blob);

      const safeDate = (data.dateISO || todayISO());
      const filename = `Daily-Briefing_${safeDate}.pdf`;

      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();

      setTimeout(()=> URL.revokeObjectURL(url), 1500);
    }

    // ===== Router =====
    if(t.toLowerCase() === "daily brief" || t.toLowerCase() === "daily briefing"){
      renderDailyBrief();
    }else{
      renderPlaceholder(t);
    }
  </script>
</body>
