<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Form</title>

  <style>
    :root{
      --bg:#f6f7f9;
      --card:#ffffff;
      --text:#111111;
      --muted:#6b7280;
      --line:#e5e7eb;
      --yellow:#ffd600;
      --radius:18px;

      --btn:#111;
      --btnText:#fff;

      --okBg:#ecfdf5;    --okBd:#a7f3d0;  --okTx:#065f46;
      --badBg:#fef2f2;   --badBd:#fecaca; --badTx:#7f1d1d;
      --warnBg:#fffbeb;  --warnBd:#fde68a;--warnTx:#92400e;
    }

    *{ box-sizing:border-box; }
    html, body{ width:100%; max-width:100%; overflow-x:hidden; }

    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap{ max-width: 980px; margin: 16px auto; padding: 0 14px; }
    .shell{
      border: 1px solid #e8eaee;
      border-radius: 24px;
      padding: 10px;
      box-shadow: 0 8px 22px rgba(0,0,0,.05);
      background: transparent;
    }

    .card{
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
    }

    .head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
    }
    h1{
      margin:0;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: .2px;
    }
    .sub{
      margin:6px 0 0;
      color: var(--muted);
      font-weight: 700;
      font-size: 13px;
      line-height: 1.35;
    }

    .pillRow{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      justify-content:flex-end;
      align-items:center;
      margin-top: 2px;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 7px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background:#fff;
      color: var(--muted);
      font-weight: 800;
      font-size: 12px;
      white-space:nowrap;
    }
    .pill.ok{ background: var(--okBg); border-color: var(--okBd); color: var(--okTx); }
    .pill.bad{ background: var(--badBg); border-color: var(--badBd); color: var(--badTx); }
    .pill.warn{ background: var(--warnBg); border-color: var(--warnBd); color: var(--warnTx); }

    .banner{
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid var(--warnBd);
      background: var(--warnBg);
      color: var(--warnTx);
      font-weight: 800;
      font-size: 13px;
      display:none;
    }

    .section{
      margin-top: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      background:#fff;
    }
    .sectionTitle{
      margin:0 0 10px;
      font-weight: 900;
      font-size: 13px;
      letter-spacing:.2px;
      color:#111;
    }

    label{
      display:block;
      font-size: 12px;
      font-weight: 800;
      color:#111;
      margin: 0 0 6px;
    }
    input, select, textarea{
      width:100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
      background:#fff;
    }
    textarea{ min-height: 92px; resize: vertical; }

    .grid2{
      display:grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .grid3auto{
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 10px;
    }

    .check{
      display:flex;
      align-items:center;
      gap:10px;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px 12px;
      background:#fff;
      font-weight: 800;
      font-size: 13px;
    }
    .check input{ width:18px; height:18px; }

    .attTop{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom: 10px;
    }

    .attRow{
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px;
      background:#fff;
      margin-top: 10px;
      display:grid;
      grid-template-columns: 2fr 1fr 2fr 1.2fr;
      gap: 10px;
      align-items:end;
    }

    .sigPreview{
      height: 44px;
      border: 1px dashed var(--line);
      border-radius: 12px;
      background:#fafafa;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }
    .sigPreview img{
      width:100%;
      height:100%;
      object-fit: contain;
      background:#fff;
    }
    .sigPreview span{
      color: var(--muted);
      font-weight: 800;
      font-size: 12px;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border-radius: 999px;
      padding: 10px 16px;
      font-weight: 900;
      text-decoration:none;
      cursor:pointer;
      border: 1px solid rgba(0,0,0,.10);
      box-shadow: 0 2px 0 rgba(0,0,0,.10);
      user-select:none;
      background: var(--btn);
      color: var(--btnText);
      white-space:nowrap;
    }
    .btn:active{ transform: translateY(1px); }
    .btnYellow{
      background: var(--yellow);
      border-color: #caa900;
      color:#111;
    }
    .btnGhost{
      background:#fff;
      color:#111;
      border:1px solid var(--line);
      box-shadow:none;
    }
    .btnDanger{
      background:#fff;
      color: #7f1d1d;
      border:1px solid #fecaca;
      box-shadow:none;
      font-weight: 900;
    }

    .btnRow{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .stickyBar{
      position: sticky;
      bottom: 0;
      margin-top: 14px;
      padding-top: 12px;
      background: linear-gradient(to top, rgba(246,247,249,1), rgba(246,247,249,.0));
    }

    .actionBar{
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:#fff;
      padding: 10px;
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
      flex-wrap:wrap;
    }

    .note{
      margin-top: 10px;
      color: var(--muted);
      font-weight: 700;
      font-size: 12px;
      line-height: 1.35;
    }

    /* Signature modal */
    .modalOverlay{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.40);
      display:none;
      align-items:center;
      justify-content:center;
      padding: 14px;
      z-index: 50;
    }
    .modal{
      width: min(760px, 100%);
      background: #fff;
      border-radius: 18px;
      border: 1px solid var(--line);
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
      overflow:hidden;
    }
    .modalHead{
      padding: 14px;
      border-bottom: 1px solid var(--line);
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
    }
    .modalHead strong{ font-size: 14px; }
    .modalBody{ padding: 12px 14px; }
    .sigCanvasWrap{
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow:hidden;
      background: #fff;
      touch-action: none;
    }
    canvas{
      width:100%;
      height: 240px;
      display:block;
      background:#fff;
    }
    .modalFoot{
      padding: 12px 14px 14px;
      border-top: 1px solid var(--line);
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:space-between;
      align-items:center;
    }
    .modalHelp{
      color: var(--muted);
      font-weight: 800;
      font-size: 12px;
    }

    @media (max-width: 900px){
      .grid2{ grid-template-columns: 1fr; }
      .attRow{ grid-template-columns: 1fr; }
      canvas{ height: 220px; }
      .pillRow{ justify-content:flex-start; }
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>

<body>
  <div class="wrap">
    <div class="shell">
      <div id="app" class="card"></div>
    </div>
  </div>

  <!-- Signature Modal -->
  <div id="sigOverlay" class="modalOverlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-label="Signature">
      <div class="modalHead">
        <strong id="sigTitle">Signature</strong>
        <button id="sigCloseTop" class="btn btnGhost" type="button">Close</button>
      </div>

      <div class="modalBody">
        <div class="sigCanvasWrap">
          <canvas id="sigCanvas"></canvas>
        </div>
      </div>

      <div class="modalFoot">
        <div class="btnRow">
          <button id="sigClear" class="btn btnGhost" type="button">Clear</button>
          <button id="sigCancel" class="btn btnGhost" type="button">Cancel</button>
        </div>

        <div class="btnRow" style="align-items:center;">
          <span class="modalHelp">Draw with finger/mouse, then Save.</span>
          <button id="sigSave" class="btn btnYellow" type="button">Save signature</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function ensurePdfLib(){
      const check = () => !!window.PDFLib;
      if (check()) return;

      const s = document.createElement("script");
      s.src = "https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js";
      document.head.appendChild(s);
    })();
  </script>

  <script>
    const $ = (q) => document.querySelector(q);
    const el = (tag, attrs={}, children=[]) => {
      const n = document.createElement(tag);
      Object.entries(attrs).forEach(([k,v])=>{
        if(k === "class") n.className = v;
        else if(k === "html") n.innerHTML = v;
        else if(k.startsWith("on") && typeof v === "function") n.addEventListener(k.substring(2), v);
        else n.setAttribute(k, v);
      });
      children.forEach(c => n.appendChild(typeof c === "string" ? document.createTextNode(c) : c));
      return n;
    };

    const params = new URLSearchParams(location.search);
    const t = (params.get("t") || "Form").trim();
    document.title = t;

    const sigStore = new Map();
    const makeId = () => "id_" + Math.random().toString(16).slice(2) + "_" + Date.now().toString(16);

    const pad2 = (n) => String(n).padStart(2,"0");
    const todayISO = () => {
      const d = new Date();
      return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
    };
    const toDDMMYYYY = (iso) => {
      if(!iso || !iso.includes("-")) return iso || "";
      const [y,m,d] = iso.split("-");
      return `${pad2(d)}/${pad2(m)}/${y}`;
    };

    function showBanner(msg, type="warn"){
      const b = $("#banner");
      b.style.display = "block";
      b.style.borderColor = (type==="bad") ? "var(--badBd)" : "var(--warnBd)";
      b.style.background = (type==="bad") ? "var(--badBg)" : "var(--warnBg)";
      b.style.color = (type==="bad") ? "var(--badTx)" : "var(--warnTx)";
      b.textContent = msg;
    }
    function hideBanner(){
      const b = $("#banner");
      if(!b) return;
      b.style.display = "none";
      b.textContent = "";
    }

    function renderPlaceholder(title){
      const app = $("#app");
      app.innerHTML = "";
      app.appendChild(el("div",{class:"head"},[
        el("div",{},[
          el("h1",{},[title]),
          el("div",{class:"sub"},["This is a placeholder page."])
        ]),
        el("div",{class:"pillRow"},[
          el("a",{class:"btn btnYellow", href:"daily.html"},["Back"])
        ])
      ]));
    }

    const SigModal = (() => {
      const overlay = $("#sigOverlay");
      const canvas = $("#sigCanvas");
      const titleEl = $("#sigTitle");
      const btnClear = $("#sigClear");
      const btnCancel = $("#sigCancel");
      const btnSave = $("#sigSave");
      const btnCloseTop = $("#sigCloseTop");

      let ctx, drawing=false, hasInk=false;
      let currentAttId=null;
      let onSavedCb=null;

      const resizeCanvas = () => {
        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.floor(rect.width * dpr);
        canvas.height = Math.floor(rect.height * dpr);
        ctx = canvas.getContext("2d");
        ctx.setTransform(dpr,0,0,dpr,0,0);
        clearCanvas();
      };

      const clearCanvas = () => {
        if(!ctx) return;
        const rect = canvas.getBoundingClientRect();
        ctx.clearRect(0,0,rect.width,rect.height);
        ctx.fillStyle = "#fff";
        ctx.fillRect(0,0,rect.width,rect.height);
        ctx.strokeStyle = "#000";
        ctx.lineWidth = 2.4;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        hasInk = false;
      };

      const getPos = (evt) => {
        const rect = canvas.getBoundingClientRect();
        return { x: (evt.clientX - rect.left), y: (evt.clientY - rect.top) };
      };

      const start = (evt) => {
        evt.preventDefault();
        drawing = true;
        const p = getPos(evt);
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
      };

      const move = (evt) => {
        if(!drawing) return;
        evt.preventDefault();
        const p = getPos(evt);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
        hasInk = true;
      };

      const end = (evt) => {
        if(!drawing) return;
        evt.preventDefault();
        drawing = false;
      };

      canvas.addEventListener("pointerdown", start);
      canvas.addEventListener("pointermove", move);
      window.addEventListener("pointerup", end);
      window.addEventListener("pointercancel", end);

      btnClear.addEventListener("click", clearCanvas);

      const close = () => {
        overlay.style.display = "none";
        overlay.setAttribute("aria-hidden","true");
        currentAttId = null;
        onSavedCb = null;
      };

      btnCancel.addEventListener("click", close);
      btnCloseTop.addEventListener("click", close);

      btnSave.addEventListener("click", () => {
        if(!currentAttId) return;
        if(!hasInk){
          alert("Please sign first, then Save.");
          return;
        }
        const dataUrl = canvas.toDataURL("image/png");
        sigStore.set(currentAttId, dataUrl);
        if(typeof onSavedCb === "function") onSavedCb(currentAttId, dataUrl);
        close();
      });

      window.addEventListener("resize", () => {
        if(overlay.style.display === "flex") resizeCanvas();
      });

      const open = (attId, label, cb) => {
        currentAttId = attId;
        onSavedCb = cb;
        titleEl.textContent = label ? `Signature: ${label}` : "Signature";
        overlay.style.display = "flex";
        overlay.setAttribute("aria-hidden","false");
        setTimeout(resizeCanvas, 50);
      };

      return { open };
    })();

    function renderConfinedSpacePermit(){
      const app = $("#app");
      app.innerHTML = "";

      const state = {
        permitNo: "",
        dateISO: todayISO(),
        startTime: "",
        finishTime: "",
        location: "",
        workDescription: "",
        personnel: "",
        equipment: "",
        riskAssessment: {
          o2: false, toxic: false, flammable: false, ingress: false, sludge: false,
          animals: false, mechanical: false, hotwork: false, chemicals: false,
          physical: false, temperature: false, radiation: false
        },
        riskOthers: "",
        controls: {
          isoPhys: false, isoElec: false, isoMech: false, cleaning: false,
          ventNat: false, ventForced: false, light110: false, lightLow: false,
          signage: false, comms: false, testing: false, monitoring: false,
          extinguishers: false, rpe: false, ppe: false, training: false
        },
        controlsOthers: "",
        emergency: {
          plan: false, tripod: false, harness: false, fallArrest: false,
          stretcher: false, resuscitation: false, ba: false, light: false,
          alarm: false, comms: false, standby: false
        },
        firstAid: "",
        commMethod: ""
      };

      const head = el("div",{class:"head"},[
        el("div",{},[
          el("h1",{},["Confined Space Permit"]),
          el("div",{class:"sub"},["Pre-fill the permit details, then download the PDF to be completed by hand on site."])
        ]),
        el("div",{class:"pillRow"},[
          el("span",{id:"pillLib", class:"pill warn"},["PDF engine: checking…"]),
          el("span",{id:"pillTpl", class:"pill ok"},["Template: Ready"])
        ])
      ]);

      const banner = el("div",{id:"banner", class:"banner"},[""]);

      const sDetails = el("div",{class:"section"},[
        el("div",{class:"sectionTitle"},["1. Work Description"]),
        el("div",{class:"grid2"},[
          field("Permit No.","permitNo","text","e.g. CSP-001"),
          field("Date","dateISO","date",""),
          field("Start Time","startTime","time",""),
          field("Finish Time","finishTime","time",""),
          field("Location","location","text","e.g. Shaft 4"),
        ]),
        el("div",{style:"margin-top:12px"},[
          textareaField("Work Description","workDescription","What work is being carried out?"),
          textareaField("Personnel entering","personnel","Names of operatives entering the confined space"),
        ])
      ]);

      const sEquipment = el("div",{class:"section"},[
        el("div",{class:"sectionTitle"},["2. Equipment / Tools to be used"]),
        textareaField("Tools & Equipment","equipment","List all tools, plant and equipment to be used...")
      ]);

      const sRisk = el("div",{class:"section"},[
        el("div",{class:"sectionTitle"},["3. Risk Assessment"]),
        el("div",{class:"grid3auto"},[
          chk("ra_o2","Oxygen enrichment/deficiency"),
          chk("ra_toxic","Toxic gases/vapours/fumes"),
          chk("ra_flammable","Flammable gases/vapours/fumes"),
          chk("ra_ingress","Ingress of liquids/gas/solids"),
          chk("ra_sludge","Sludge/deposits/waste"),
          chk("ra_animals","Animals/biological hazards"),
          chk("ra_mechanical","Mechanical/electrical hazards"),
          chk("ra_hotwork","Hot work within space"),
          chk("ra_chemicals","Use of chemicals"),
          chk("ra_physical","Physical/structural hazards"),
          chk("ra_temperature","Temperature extremes"),
          chk("ra_radiation","Ionising radiation"),
        ]),
        el("div",{style:"margin-top:12px"},[
          field("Others (specify)","riskOthers","text","Any other risks...")
        ])
      ]);

      const sControls = el("div",{class:"section"},[
        el("div",{class:"sectionTitle"},["3. Controls"]),
        el("div",{class:"grid3auto"},[
          chk("co_isoPhys","Isolation - Physical"),
          chk("co_isoElec","Isolation - Electrical"),
          chk("co_isoMech","Isolation - Mechanical"),
          chk("co_cleaning","Cleaning/Purging of space"),
          chk("co_ventNat","Ventilation - Natural"),
          chk("co_ventForced","Ventilation - Forced"),
          chk("co_light110","Lighting - 110V"),
          chk("co_lightLow","Lighting - Low Voltage"),
          chk("co_signage","Safety signage/Barricades"),
          chk("co_comms","Communication equipment"),
          chk("co_testing","Atmospheric testing (initial)"),
          chk("co_monitoring","Constant monitoring"),
          chk("co_extinguishers","Fire extinguishers"),
          chk("co_rpe","RPE (BA / Escape set)"),
          chk("co_ppe","Specific PPE"),
          chk("co_training","Training/Competence"),
        ]),
        el("div",{style:"margin-top:12px"},[
          field("Others (specify)","controlsOthers","text","Any other controls...")
        ])
      ]);

      const sEmergency = el("div",{class:"section"},[
        el("div",{class:"sectionTitle"},["4. Emergency Arrangements"]),
        el("div",{class:"grid3auto"},[
          chk("em_plan","Rescue plan in place"),
          chk("em_tripod","Tripod / Winch / Davit"),
          chk("em_harness","Harness / Rescue line"),
          chk("em_fallArrest","Fall arrest equipment"),
          chk("em_stretcher","Recovery stretcher"),
          chk("em_resuscitation","Resuscitation equipment"),
          chk("em_ba","Breathing apparatus (Rescue)"),
          chk("em_light","Emergency lighting"),
          chk("em_alarm","Method of raising alarm"),
          chk("em_comms","Method of communication"),
          chk("em_standby","Standby person (Top-man)"),
        ]),
        el("div",{class:"grid2", style:"margin-top:12px"},[
          field("Emergency First Aid provision","firstAid","text","e.g. First aider on site"),
          field("Method of Communication","commMethod","text","e.g. Two-way radio"),
        ])
      ]);

      const sticky = el("div",{class:"stickyBar"},[
        el("div",{class:"actionBar"},[
          el("div",{class:"btnRow"},[
            el("a",{class:"btn btnYellow", href:"daily.html"},["Back"]),
          ]),
          el("div",{class:"btnRow"},[
            el("button",{id:"btnDownload", class:"btn", type:"button", onclick: async()=> {
              hideBanner();
              await onDownload();
            }},["Download PDF"])
          ])
        ])
      ]);

      app.appendChild(head);
      app.appendChild(banner);
      app.appendChild(sDetails);
      app.appendChild(sEquipment);
      app.appendChild(sRisk);
      app.appendChild(sControls);
      app.appendChild(sEmergency);
      app.appendChild(sticky);

      checkTemplateAndLib();

      function field(labelText, id, type, placeholder){
        return el("div",{},[
          el("label",{for:id},[labelText]),
          el("input",{id, type, placeholder})
        ]);
      }
      function textareaField(labelText, id, placeholder){
        return el("div",{},[
          el("label",{for:id},[labelText]),
          el("textarea",{id, placeholder})
        ]);
      }
      function chk(id, labelText){
        return el("label",{class:"check", for:id},[
          el("input",{type:"checkbox", id}),
          el("span",{},[labelText])
        ]);
      }

      async function onDownload(){
        const btn = $("#btnDownload");
        btn.disabled = true;
        btn.textContent = "Generating…";
        try{
          const data = {
            permitNo: $("#permitNo").value.trim(),
            dateISO: $("#dateISO").value,
            startTime: $("#startTime").value,
            finishTime: $("#finishTime").value,
            location: $("#location").value.trim(),
            workDescription: $("#workDescription").value.trim(),
            personnel: $("#personnel").value.trim(),
            equipment: $("#equipment").value.trim(),
            riskAssessment: {
              o2: $("#ra_o2").checked, toxic: $("#ra_toxic").checked, flammable: $("#ra_flammable").checked,
              ingress: $("#ra_ingress").checked, sludge: $("#ra_sludge").checked, animals: $("#ra_animals").checked,
              mechanical: $("#ra_mechanical").checked, hotwork: $("#ra_hotwork").checked, chemicals: $("#ra_chemicals").checked,
              physical: $("#ra_physical").checked, temperature: $("#ra_temperature").checked, radiation: $("#ra_radiation").checked
            },
            riskOthers: $("#riskOthers").value.trim(),
            controls: {
              isoPhys: $("#co_isoPhys").checked, isoElec: $("#co_isoElec").checked, isoMech: $("#co_isoMech").checked,
              cleaning: $("#co_cleaning").checked, ventNat: $("#co_ventNat").checked, ventForced: $("#co_ventForced").checked,
              light110: $("#co_light110").checked, lightLow: $("#co_lightLow").checked, signage: $("#co_signage").checked,

    async function generateConfinedSpacePDF(data){
      if(!window.PDFLib){
        throw new Error("PDF engine is blocked.");
      }

      const { PDFDocument, StandardFonts, rgb } = PDFLib;
      const pdfDoc = await PDFDocument.create();
      const helv = await pdfDoc.embedFont(StandardFonts.Helvetica);
      const helvBold = await pdfDoc.embedFont(StandardFonts.HelveticaBold);

      async function fetchImage(url){
        try{
          const res = await fetch(url, { cache:"no-store" });
          if(!res.ok) return null;
          return new Uint8Array(await res.arrayBuffer());
        }catch(err){
          return null;
        }
      }

      const imgBytes1 = await fetchImage("assets/csp-1.jpg");
      const imgBytes2 = await fetchImage("assets/csp-2.jpg");
      const imgBytes3 = await fetchImage("assets/csp-3.jpg");
      const imgBytes4 = await fetchImage("assets/csp-4.jpg");

      if(!imgBytes1 || !imgBytes2 || !imgBytes3 || !imgBytes4){
        throw new Error("Could not load template images.");
      }

      const img1 = await pdfDoc.embedJpg(imgBytes1);
      const img2 = await pdfDoc.embedJpg(imgBytes2);
      const img3 = await pdfDoc.embedJpg(imgBytes3);
      const img4 = await pdfDoc.embedJpg(imgBytes4);

      const A4 = [595.28, 841.89];
      const BLACK = rgb(0,0,0);

      const drawText = (page, text, x, y, size=10, font=helv) => {
        if(!text) return;
        page.drawText(String(text), { x, y, size, font, color: BLACK });
      };

      const wrapLines = (font, text, size, maxWidth) => {
        const words = String(text || "").split(/\s+/);
        const lines = [];
        let line = "";
        for(const w of words){
          const test = line ? line + " " + w : w;
          if(font.widthOfTextAtSize(test, size) <= maxWidth) line = test;
          else { lines.push(line); line = w; }
        }
        if(line) lines.push(line);
        return lines;
      };

      const drawWrapped = (page, text, x, y, maxWidth, size=9, font=helv, lineHeight=11) => {
        const lines = wrapLines(font, text, size, maxWidth);
        lines.forEach((ln, i) => {
          page.drawText(ln, { x, y: y - (i * lineHeight), size, font, color: BLACK });
        });
      };

      const drawCheck = (page, x, y) => {
        page.drawText("X", { x, y, size: 10, font: helvBold, color: BLACK });
      };

      // Page 1
      const p1 = pdfDoc.addPage(A4);
      p1.drawImage(img1, { x:0, y:0, width: A4[0], height: A4[1] });

      drawText(p1, toDDMMYYYY(data.dateISO), 75, 762);
      drawText(p1, data.permitNo, 450, 762);
      drawText(p1, data.startTime, 75, 742);
      drawText(p1, data.finishTime, 200, 742);
      drawText(p1, data.location, 75, 722);

      drawWrapped(p1, data.workDescription, 55, 665, 500);
      drawWrapped(p1, data.personnel, 55, 595, 500);
      drawWrapped(p1, data.equipment, 55, 520, 500);

      // Section 3 Risks
      const ra = data.riskAssessment;
      if(ra.o2) drawCheck(p1, 442, 412);
      if(ra.toxic) drawCheck(p1, 442, 398);
      if(ra.flammable) drawCheck(p1, 442, 384);
      if(ra.ingress) drawCheck(p1, 442, 370);
      if(ra.sludge) drawCheck(p1, 442, 356);
      if(ra.animals) drawCheck(p1, 442, 342);
      if(ra.mechanical) drawCheck(p1, 442, 328);
      if(ra.hotwork) drawCheck(p1, 442, 314);
      if(ra.chemicals) drawCheck(p1, 442, 300);
      if(ra.physical) drawCheck(p1, 442, 286);
      if(ra.temperature) drawCheck(p1, 442, 272);
      if(ra.radiation) drawCheck(p1, 442, 258);
      drawText(p1, data.riskOthers, 120, 244, 8);

      // Page 2
      const p2 = pdfDoc.addPage(A4);
      p2.drawImage(img2, { x:0, y:0, width: A4[0], height: A4[1] });

      const co = data.controls;
      if(co.isoPhys) drawCheck(p2, 442, 748);
      if(co.isoElec) drawCheck(p2, 442, 734);
      if(co.isoMech) drawCheck(p2, 442, 720);
      if(co.cleaning) drawCheck(p2, 442, 706);
      if(co.ventNat) drawCheck(p2, 442, 692);
      if(co.ventForced) drawCheck(p2, 442, 678);
      if(co.light110) drawCheck(p2, 442, 664);
      if(co.lightLow) drawCheck(p2, 442, 650);
      if(co.signage) drawCheck(p2, 442, 636);
      if(co.comms) drawCheck(p2, 442, 622);
      if(co.testing) drawCheck(p2, 442, 608);
      if(co.monitoring) drawCheck(p2, 442, 594);
      if(co.extinguishers) drawCheck(p2, 442, 580);
      if(co.rpe) drawCheck(p2, 442, 566);
      if(co.ppe) drawCheck(p2, 442, 552);
      if(co.training) drawCheck(p2, 442, 538);
      drawText(p2, data.controlsOthers, 120, 524, 8);

      const em = data.emergency;
      if(em.plan) drawCheck(p2, 442, 400);
      if(em.tripod) drawCheck(p2, 442, 386);
      if(em.harness) drawCheck(p2, 442, 372);
      if(em.fallArrest) drawCheck(p2, 442, 358);
      if(em.stretcher) drawCheck(p2, 442, 344);
      if(em.resuscitation) drawCheck(p2, 442, 330);
      if(em.ba) drawCheck(p2, 442, 316);
      if(em.light) drawCheck(p2, 442, 302);
      if(em.alarm) drawCheck(p2, 442, 288);
      if(em.comms) drawCheck(p2, 442, 274);
      if(em.standby) drawCheck(p2, 442, 260);

      drawText(p2, data.firstAid, 160, 240, 9);
      drawText(p2, data.commMethod, 180, 225, 9);

      // Page 3
      const p3 = pdfDoc.addPage(A4);
      p3.drawImage(img3, { x:0, y:0, width: A4[0], height: A4[1] });

      // Page 4
      const p4 = pdfDoc.addPage(A4);
      p4.drawImage(img4, { x:0, y:0, width: A4[0], height: A4[1] });

      const outBytes = await pdfDoc.save();
      const blob = new Blob([outBytes], { type:"application/pdf" });
      const url = URL.createObjectURL(blob);
      const filename = `Confined_Space_Permit_${data.permitNo || todayISO()}.pdf`;

      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.rel = "noopener";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(()=> URL.revokeObjectURL(url), 2500);
    }

    async function generateDailyBriefPDF(data){
      if(!window.PDFLib){
        throw new Error("PDF engine is blocked (pdf-lib did not load). If you use a strict Content-Security-Policy, you must allow the CDN or host pdf-lib locally.");
      }

      const { PDFDocument, StandardFonts, rgb } = PDFLib;

      const pdfDoc = await PDFDocument.create();
      const helv = await pdfDoc.embedFont(StandardFonts.Helvetica);
      const helvBold = await pdfDoc.embedFont(StandardFonts.HelveticaBold);

      const A4 = [595.28, 841.89];
      const page1 = pdfDoc.addPage(A4);
      const page2 = pdfDoc.addPage(A4);

      const detectImageType = (bytes) => {
        if(!bytes || bytes.length < 4) return null;
        if(bytes[0] === 0xff && bytes[1] === 0xd8) return "jpeg";
        if(bytes[0] === 0x89 && bytes[1] === 0x50 && bytes[2] === 0x4e && bytes[3] === 0x47) return "png";
        return null;
      };

      const embedImageBytes = async (bytes) => {
        const type = detectImageType(bytes);
        if(type === "jpeg") return await pdfDoc.embedJpg(bytes);
        if(type === "png") return await pdfDoc.embedPng(bytes);
        return null;
      };

      async function fetchImage(url){
        try{
          const res = await fetch(url, { cache:"no-store" });
          if(!res.ok) return null;
          return new Uint8Array(await res.arrayBuffer());
        }catch(err){
          return null;
        }
      }

      let atlLogo;
      const atlBytes = await fetchImage("/atl-logo.png") || await fetchImage("atl-logo.png");
      if(atlBytes) atlLogo = await embedImageBytes(atlBytes);

      const RED = rgb(0.78, 0.1, 0.1);
      const HEADER_TEXT = rgb(1, 1, 1);
      const BLACK = rgb(0,0,0);
      const LIGHT_FILL = rgb(0.985, 0.985, 0.99);
      const YELLOW = rgb(1, 0.84, 0);

      const drawText = (page, text, x, y, size=10, font=helvBold, color=BLACK) => {
        if(!text) return;
        page.drawText(String(text), { x, y, size, font, color });
      };

      const drawCenteredText = (page, text, centerX, y, size=12, font=helvBold, color=BLACK) => {
        if(!text) return;
        const width = font.widthOfTextAtSize(String(text), size);
        page.drawText(String(text), { x: centerX - (width / 2), y, size, font, color });
      };

      const drawCell = (page, x, y, w, h, { fill, border=1 } = {}) => {
        const opts = { x, y, width:w, height:h, borderColor: BLACK, borderWidth: border };
        if(fill) opts.color = fill;
        page.drawRectangle(opts);
      };

      // Better vertical-centre baseline so text doesn't sit high
      const vCenterBaseline = (y, h, size) => {
        return y + (h - size) / 2 + (size * 0.26);
      };

      const drawTextInCell = (page, text, x, y, w, h, {
        size=10, font=helv, color=BLACK, padding=6, align="left"
      } = {}) => {
        if(text === undefined || text === null) return;
        const s = String(text);
        let tx = x + padding;

        if(align === "center"){
          const tw = font.widthOfTextAtSize(s, size);
          tx = x + (w - tw) / 2;
        }else if(align === "right"){
          const tw = font.widthOfTextAtSize(s, size);
          tx = x + w - padding - tw;
        }

        const ty = vCenterBaseline(y, h, size);
        page.drawText(s, { x: tx, y: ty, size, font, color });
      };

      // ✅ Updated: preserves manual line breaks (\n) AND wraps within each line
      const wrapLines = (font, text, size, maxWidth) => {
        const raw = String(text || "").replace(/\r/g, "");
        const parts = raw.split("\n");

        const lines = [];
        for(const part of parts){
          const words = part.split(/\s+/).filter(Boolean);
          if(words.length === 0){
            lines.push("");
            continue;
          }
          let line = "";
          for(const w of words){
            const test = line ? (line + " " + w) : w;
            const width = font.widthOfTextAtSize(test, size);
            if(width <= maxWidth) line = test;
            else { if(line) lines.push(line); line = w; }
          }
          if(line) lines.push(line);
        }
        return lines;
      };

      const drawWrappedFromTop = (page, text, x, topY, maxWidth, lineHeight=12, size=10, maxLines=20, color=BLACK, font=helvBold) => {
        const lines = wrapLines(font, text, size, maxWidth).slice(0, maxLines);
        let y = topY;
        for(const ln of lines){
          page.drawText(ln, { x, y, size, font, color });
          y -= lineHeight;
        }
      };

      // Vertically centred + left aligned wrapped text block inside a cell
      const drawWrappedVCenterLeft = (page, text, x, y, w, h, {
        size=8.2,
        font=helvBold,
        color=BLACK,
        padding=8,
        lineHeight=10,
        maxLines=2
      } = {}) => {
        const maxWidth = w - padding*2;
        const lines = wrapLines(font, text, size, maxWidth).slice(0, maxLines);
        const n = lines.length || 1;

        const blockH = n * lineHeight;
        const topPad = Math.max(0, (h - blockH) / 2);

        const firstBoxTop = y + h - topPad - lineHeight;
        const base0 = firstBoxTop + (lineHeight - size) / 2 + (size * 0.18);

        for(let i=0;i<n;i++){
          page.drawText(lines[i], {
            x: x + padding,
            y: base0 - i*lineHeight,
            size,
            font,
            color
          });
        }
      };

      // Only one yellow label: YES or NO (centred)
      const drawYesNoSingle = (page, x, y, w, h, value) => {
        const v = String(value || "").trim().toUpperCase() === "NO" ? "NO" : "YES";
        const boxH = Math.min(14, h - 4);
        const boxW = Math.min(44, w - 4);
        const bx = x + w - boxW - 2;
        const by = y + (h - boxH) / 2;

        drawCell(page, bx, by, boxW, boxH, { fill: YELLOW, border: 1 });
        drawTextInCell(page, v, bx, by, boxW, boxH, { size:7.4, font:helvBold, align:"center" });
      };

      const drawCheckmark = (page, boxX, boxY, boxW, boxH) => {
        const centerX = boxX + (boxW / 2);
        const centerY = boxY + (boxH / 2);
        const radius = Math.min(boxW, boxH) * 0.28;
        page.drawCircle({ x: centerX, y: centerY, size: radius, color: BLACK });
      };

      const fitFontSizeToWidth = (font, text, startSize, maxWidth, minSize=6.2) => {
        let size = startSize;
        const t = String(text || "");
        while(size > minSize && font.widthOfTextAtSize(t, size) > maxWidth){
          size -= 0.2;
        }
        return Math.max(minSize, size);
      };

      const ddmmyyyy = toDDMMYYYY(data.dateISO);
      const attendeesCount = (data.attendees || []).length;

      function drawHeader(page){
        if(atlLogo){
          const scale = 140 / atlLogo.width;
          page.drawImage(atlLogo, { x:40, y:760, width: atlLogo.width * scale, height: atlLogo.height * scale });
        }
        drawText(page, "ATL Daily Task Briefing", 430, 795, 9, helvBold, RED);
        drawText(page, "QPFS12.4", 430, 783, 9, helvBold, RED);
        drawCell(page, 40, 705, 515, 22, { fill: RED, border: 1 });
        drawCenteredText(page, "HEALTH & SAFETY - MORNING BRIEFING", 297.5, 712, 12, helvBold, HEADER_TEXT);
      }

      function drawIntroTable(page){
        const marginX = 40;
        const tableTop = 680;
        const rowH = 26;
        const labelW = 140;
        const valueW = 190;
        const label2W = 110;
        const value2W = 75;

        const rows = [
          ["PROJECT TITLE", data.projectTitle, "SITE LOCATION", data.siteLocation],
          ["Work Location", data.workLocation, "Project no:", data.projectNo],
          ["NAME OF PERSON\nGIVING BRIEFING", data.brieferName, "DATE", ddmmyyyy],
          ["JOB TITLE", data.jobTitle, "NO. OF PERSONS\nATTENDING BRIEFING", String(attendeesCount || "")]
        ];

        rows.forEach((row, i) => {
          const y = tableTop - (rowH * (i + 1));

          drawCell(page, marginX, y, labelW, rowH);
          drawCell(page, marginX + labelW, y, valueW, rowH, { fill: LIGHT_FILL });

          drawCell(page, marginX + labelW + valueW, y, label2W, rowH);
          drawCell(page, marginX + labelW + valueW + label2W, y, value2W, rowH, { fill: LIGHT_FILL });

          // ✅ FIX: labels are vertically centered in their cells (left-aligned)
          drawWrappedVCenterLeft(page, row[0], marginX, y, labelW, rowH, {
            size: 8.6, font: helvBold, padding: 8, lineHeight: 10, maxLines: 2
          });

          drawTextInCell(page, row[1], marginX + labelW, y, valueW, rowH, { size:10, font:helv, align:"left" });

          drawWrappedVCenterLeft(page, row[2], marginX + labelW + valueW, y, label2W, rowH, {
            size: 8.2, font: helvBold, padding: 8, lineHeight: 10, maxLines: 2
          });

          drawTextInCell(page, row[3], marginX + labelW + valueW + label2W, y, value2W, rowH, { size:10, font:helv, align:"left" });
        });

        return tableTop - (rowH * rows.length) - 10;
      }

      function drawPreviousDay(page, startY){
        const marginX = 40;
        const headerH = 20;

        drawCell(page, marginX, startY - headerH, 395, headerH, { fill: RED });
        drawCell(page, marginX + 395, startY - headerH, 120, headerH, { fill: RED });

        drawTextInCell(page, "PREVIOUS DAY'S ACTIVITIES", marginX, startY - headerH, 395, headerH, { size:9, font:helvBold, color:HEADER_TEXT });

        drawWrappedFromTop(page, "DID THEY GO AS\nPLANNED?", marginX + 395 + 6, startY - 6, 70, 9, 7.2, 2, HEADER_TEXT, helvBold);
        drawYesNoSingle(page, marginX + 395, startY - headerH, 120, headerH, data.prevPlanned);

        const qRowH = 24;
        const aRowH = 64;

        const qY = startY - headerH - qRowH;
        drawCell(page, marginX, qY, 515, qRowH);
        drawTextInCell(page, "Any concerns from the previous day?", marginX, qY, 515, qRowH, { size:9.2, font:helvBold });

        const aY = qY - aRowH;
        drawCell(page, marginX, aY, 515, aRowH, { fill: LIGHT_FILL });
        drawWrappedFromTop(page, data.prevConcerns, marginX + 6, aY + aRowH - 10, 500, 12, 10, 5, BLACK, helv);

        return aY - 12;
      }

      function drawTodayPlanned(page, startY){
        const marginX = 40;
        const headerH = 18;

        drawCell(page, marginX, startY - headerH, 515, headerH, { fill: RED });
        drawTextInCell(page, "TODAY'S PLANNED ACTIVITIES BRIEFING", marginX, startY - headerH, 515, headerH, { size:9, font:helvBold, color:HEADER_TEXT });

        const bodyH = 110;
        const bodyY = startY - headerH - bodyH;

        drawCell(page, marginX, bodyY, 515, bodyH, { fill: LIGHT_FILL });
        drawWrappedFromTop(page, data.todayPlanned, marginX + 6, bodyY + bodyH - 10, 500, 12, 10, 8, BLACK, helv);

        return bodyY - 14;
      }

      function drawPointsGrid(page, startY){
        const marginX = 40;
        const headerH = 16;

        drawCell(page, marginX, startY - headerH, 515, headerH, { fill: RED });
        drawTextInCell(page, "Points discussed for today's operation:", marginX, startY - headerH, 515, headerH, { size:8, font:helvBold, color:HEADER_TEXT });

        const rowH = 18;
        const colGroups = [
          { labelW: 150, checkW: 20 },
          { labelW: 150, checkW: 20 },
          { labelW: 155, checkW: 20 }
        ];

        const rows = [
          ["confined", "barriers", "coshh"],
          ["emergency", "clearAccess", "fire"],
          ["lifting", "methodStatements", "materials"],
          ["permits", "suitablePPE", "competence"],
          ["plant", "trenchCollapse", "cables"],
          ["safetyPlanning", "welfare", "trips"],
        ];

        const labels = {
          confined: "Confined Spaces / Areas",
          emergency: "Emergency Procedures",
          lifting: "Lifting Equipment – Chains / Slings",
          permits: "Permits to Work",
          plant: "Plant & Equipment",
          safetyPlanning: "Safety Planning",
          barriers: "Barriers / Edge Protection",
          clearAccess: "Clear Access Ways",
          methodStatements: "Method Statements / Risk Assessments",
          suitablePPE: "Suitable PPE",
          trenchCollapse: "Trench Collapse",
          welfare: "Welfare Facilities",
          coshh: "COSHH Assessments",
          fire: "Fire Precautions",
          materials: "Materials",
          competence: "Operative Experience / Competence",
          cables: "Overhead / Underground Cable Strike",
          trips: "Trips / Falls"
        };

        let y = startY - headerH;

        rows.forEach((row) => {
          y -= rowH;
          let x = marginX;

          row.forEach((key, idx) => {
            const group = colGroups[idx];
            drawCell(page, x, y, group.labelW, rowH);
            drawCell(page, x + group.labelW, y, group.checkW, rowH, { fill: LIGHT_FILL });

            const txt = labels[key];
            const maxW = group.labelW - 12;
            const size = fitFontSizeToWidth(helvBold, txt, 8.0, maxW, 6.4);
            drawTextInCell(page, txt, x, y, group.labelW, rowH, { size, font:helvBold, align:"left" });

            if(data.points && data.points[key]){
              drawCheckmark(page, x + group.labelW + 2, y + 3, group.checkW - 4, rowH - 6);
            }

            x += group.labelW + group.checkW;
          });
        });

        const footerH = 16;
        const footerY = y - 2 - footerH;
        drawCell(page, marginX, footerY, 515, footerH, { fill: RED });
        drawCenteredText(page, "This list is not exhaustive  -  REMEMBER – MANAGE HEALTH & SAFETY", 297.5, footerY + 4, 8, helvBold, HEADER_TEXT);

        return footerY - 4;
      }

      function drawConfirmations(page, startY){
        const marginX = 40;
        const rowH = 28;
        const textW = 460;
        const boxW = 55;

        const items = [
          { text: "Are all today's activities covered by the Operation Procedure / Method Statement / Risk Assessment / Work Instruction?", value: data.covered },
          { text: "Are all Control Measures in place?", value: data.controls },
          { text: "Are all operatives compliant with the site requirements for PPE?", value: data.ppe }
        ];

        let y = startY;

        items.forEach(item => {
          y -= rowH;
          drawCell(page, marginX, y, textW, rowH);
          drawCell(page, marginX + textW, y, boxW, rowH);

          drawWrappedVCenterLeft(page, item.text, marginX, y, textW, rowH, {
            size:7.4, font:helvBold, padding:8, lineHeight:9.4, maxLines:3
          });

          drawYesNoSingle(page, marginX + textW, y, boxW, rowH, item.value);
        });
      }

      function drawSignUpPage(page){
        drawHeader(page);

        drawCell(page, 40, 675, 515, 20, { fill: RED });
        drawCenteredText(page, "HEALTH & SAFETY – MORNING BRIEFING SIGN-UP Sheet", 297.5, 680, 9, helvBold, HEADER_TEXT);

        drawCell(page, 40, 645, 515, 30);
        drawWrappedFromTop(
          page,
          "Signing of this briefing confirms that all control measures defined in the associated risk assessments are in place, anyone joining the working group must be briefed prior to starting",
          50, 668, 495, 10, 8, 3, BLACK, helv
        );

        drawCell(page, 40, 632, 515, 20, { fill: RED });
        drawCenteredText(page, "ATTENDEES", 297.5, 637, 8, helvBold, HEADER_TEXT);
      }

      async function drawAttendeeTable(page, startY, attendees, startIndex){
        const marginX = 40;
        const rowH = 18;
        const rowsPerPage = 32;

        const nameW = 250;
        const dateW = 110;
        const sigW = 155;

        const headerY = startY;

        drawCell(page, marginX, headerY, nameW, rowH, { fill: RED });
        drawCell(page, marginX + nameW, headerY, dateW, rowH, { fill: RED });
        drawCell(page, marginX + nameW + dateW, headerY, sigW, rowH, { fill: RED });

        drawTextInCell(page, "NAME", marginX, headerY, nameW, rowH, { size:8, font:helvBold, color:HEADER_TEXT, align:"left" });
        drawTextInCell(page, "DATE", marginX + nameW, headerY, dateW, rowH, { size:8, font:helvBold, color:HEADER_TEXT, align:"left" });
        drawTextInCell(page, "SIGNATURE", marginX + nameW + dateW, headerY, sigW, rowH, { size:8, font:helvBold, color:HEADER_TEXT, align:"left" });

        const fitInto = (imgW, imgH, maxW, maxH) => {
          const r = Math.min(maxW / imgW, maxH / imgH);
          return { w: imgW * r, h: imgH * r };
        };

        const decodeDataUrl = (dataUrl) => {
          if(!dataUrl || typeof dataUrl !== "string") return null;
          const match = dataUrl.match(/^data:(image\/(png|jpeg|jpg));base64,(.+)$/i);
          if(!match) return null;
          const b64 = match[3];
          if(!b64) return null;
          const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
          return { bytes };
        };

        const embedImageFromDataUrl = async (dataUrl) => {
          const decoded = decodeDataUrl(dataUrl);
          if(!decoded) return null;
          return await embedImageBytes(decoded.bytes);
        };

        let y = headerY - rowH;
        let idx = startIndex;

        for(let i=0;i<rowsPerPage;i++){
          drawCell(page, marginX, y, nameW, rowH, { fill: LIGHT_FILL });
          drawCell(page, marginX + nameW, y, dateW, rowH, { fill: LIGHT_FILL });
          drawCell(page, marginX + nameW + dateW, y, sigW, rowH, { fill: LIGHT_FILL });

          const a = attendees[idx];
          if(a){
            drawTextInCell(page, a.name, marginX, y, nameW, rowH, { size:9.4, font:helv, align:"left" });
            drawTextInCell(page, toDDMMYYYY(a.dateISO), marginX + nameW, y, dateW, rowH, { size:9.4, font:helv, align:"left" });

            if(a.signature){
              const embed = await embedImageFromDataUrl(a.signature);
              if(embed){
                const maxW = sigW - 10;
                const maxH = rowH - 4;
                const s = fitInto(embed.width, embed.height, maxW, maxH);
                const xImg = marginX + nameW + dateW + 5 + ((maxW - s.w) / 2);
                const yImg = y + 2 + ((maxH - s.h) / 2);
                page.drawImage(embed, { x: xImg, y: yImg, width:s.w, height:s.h });
              }
            }
            idx++;
          }
          y -= rowH;
        }
        return idx;
      }

      const addPageFooter = (page, pageIndex, totalPages) => {
        drawText(page, "QPFS12.4", 40, 24, 9, helvBold, BLACK);
        drawText(page, `Page No. ${pageIndex} of ${totalPages}`, 455, 24, 9, helvBold, BLACK);
      };

      drawHeader(page1);
      let cursorY = drawIntroTable(page1);
      cursorY = drawPreviousDay(page1, cursorY);
      cursorY = drawTodayPlanned(page1, cursorY);
      cursorY = drawPointsGrid(page1, cursorY);
      drawConfirmations(page1, cursorY);

      drawSignUpPage(page2);

      const MAX_PDF_ATTENDEES = 96;
      const attendeesAll = (data.attendees || []).slice(0, MAX_PDF_ATTENDEES).map(a=>({
        name: (a.name||"").trim(),
        dateISO: (a.dateISO||data.dateISO||todayISO()),
        signature: (a.signature||"")
      }));

      let next = await drawAttendeeTable(page2, 612, attendeesAll, 0);

      while(next < attendeesAll.length){
        const p = pdfDoc.addPage(A4);
        drawSignUpPage(p);
        next = await drawAttendeeTable(p, 612, attendeesAll, next);
      }

      const pages = pdfDoc.getPages();
      pages.forEach((p, idx) => addPageFooter(p, idx + 1, pages.length));

      const outBytes = await pdfDoc.save();
      const blob = new Blob([outBytes], { type:"application/pdf" });
      const url = URL.createObjectURL(blob);
      const filename = `Daily-Briefing_${data.dateISO || todayISO()}.pdf`;

      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.rel = "noopener";
      document.body.appendChild(a);
      a.click();
      a.remove();

      setTimeout(()=> URL.revokeObjectURL(url), 2500);
    }

    if(t.toLowerCase() === "daily brief" || t.toLowerCase() === "daily briefing"){
      renderDailyBrief();
    }else if(t.toLowerCase() === "confined space permit"){
      renderConfinedSpacePermit();
    }else{
      renderPlaceholder(t);
    }
  </script>
</body>
</html>
