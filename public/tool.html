<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Form</title>

  <style>
    :root{
      --bg:#f6f7f9;
      --card:#ffffff;
      --text:#111111;
      --muted:#6b7280;
      --line:#e5e7eb;
      --yellow:#ffd600;
      --radius:18px;

      --btn:#111;
      --btnText:#fff;

      --okBg:#ecfdf5;    --okBd:#a7f3d0;  --okTx:#065f46;
      --badBg:#fef2f2;   --badBd:#fecaca; --badTx:#7f1d1d;
      --warnBg:#fffbeb;  --warnBd:#fde68a;--warnTx:#92400e;
    }

    *{ box-sizing:border-box; }
    html, body{ width:100%; max-width:100%; overflow-x:hidden; }

    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap{ max-width: 980px; margin: 16px auto; padding: 0 14px; }
    .shell{
      border: 1px solid #e8eaee;
      border-radius: 24px;
      padding: 10px;
      box-shadow: 0 8px 22px rgba(0,0,0,.05);
      background: transparent;
    }

    .card{
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
    }

    .head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
    }
    h1{
      margin:0;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: .2px;
    }
    .sub{
      margin:6px 0 0;
      color: var(--muted);
      font-weight: 700;
      font-size: 13px;
      line-height: 1.35;
    }

    .pillRow{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      justify-content:flex-end;
      align-items:center;
      margin-top: 2px;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 7px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background:#fff;
      color: var(--muted);
      font-weight: 800;
      font-size: 12px;
      white-space:nowrap;
    }
    .pill.ok{ background: var(--okBg); border-color: var(--okBd); color: var(--okTx); }
    .pill.bad{ background: var(--badBg); border-color: var(--badBd); color: var(--badTx); }
    .pill.warn{ background: var(--warnBg); border-color: var(--warnBd); color: var(--warnTx); }

    .banner{
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid var(--warnBd);
      background: var(--warnBg);
      color: var(--warnTx);
      font-weight: 800;
      font-size: 13px;
      display:none;
    }

    .section{
      margin-top: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      background:#fff;
    }
    .sectionTitle{
      margin:0 0 10px;
      font-weight: 900;
      font-size: 13px;
      letter-spacing:.2px;
      color:#111;
    }

    label{
      display:block;
      font-size: 12px;
      font-weight: 800;
      color:#111;
      margin: 0 0 6px;
    }
    input, select, textarea{
      width:100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
      background:#fff;
    }
    textarea{ min-height: 92px; resize: vertical; }

    .grid2{
      display:grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .grid3auto{
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 10px;
    }

    .check{
      display:flex;
      align-items:center;
      gap:10px;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px 12px;
      background:#fff;
      font-weight: 800;
      font-size: 13px;
    }
    .check input{ width:18px; height:18px; }

    .attTop{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom: 10px;
    }

    .attRow{
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px;
      background:#fff;
      margin-top: 10px;
      display:grid;
      grid-template-columns: 2fr 1fr 2fr 1.2fr;
      gap: 10px;
      align-items:end;
    }

    .sigPreview{
      height: 44px;
      border: 1px dashed var(--line);
      border-radius: 12px;
      background:#fafafa;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }
    .sigPreview img{
      width:100%;
      height:100%;
      object-fit: contain;
      background:#fff;
    }
    .sigPreview span{
      color: var(--muted);
      font-weight: 800;
      font-size: 12px;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border-radius: 999px;
      padding: 10px 16px;
      font-weight: 900;
      text-decoration:none;
      cursor:pointer;
      border: 1px solid rgba(0,0,0,.10);
      box-shadow: 0 2px 0 rgba(0,0,0,.10);
      user-select:none;
      background: var(--btn);
      color: var(--btnText);
      white-space:nowrap;
    }
    .btn:active{ transform: translateY(1px); }
    .btnYellow{
      background: var(--yellow);
      border-color: #caa900;
      color:#111;
    }
    .btnGhost{
      background:#fff;
      color:#111;
      border:1px solid var(--line);
      box-shadow:none;
    }
    .btnDanger{
      background:#fff;
      color: #7f1d1d;
      border:1px solid #fecaca;
      box-shadow:none;
      font-weight: 900;
    }

    .btnRow{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .stickyBar{
      position: sticky;
      bottom: 0;
      margin-top: 14px;
      padding-top: 12px;
      background: linear-gradient(to top, rgba(246,247,249,1), rgba(246,247,249,.0));
    }

    .actionBar{
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:#fff;
      padding: 10px;
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
      flex-wrap:wrap;
    }

    .note{
      margin-top: 10px;
      color: var(--muted);
      font-weight: 700;
      font-size: 12px;
      line-height: 1.35;
    }

    /* Signature modal */
    .modalOverlay{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.40);
      display:none;
      align-items:center;
      justify-content:center;
      padding: 14px;
      z-index: 50;
    }
    .modal{
      width: min(760px, 100%);
      background: #fff;
      border-radius: 18px;
      border: 1px solid var(--line);
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
      overflow:hidden;
    }
    .modalHead{
      padding: 14px;
      border-bottom: 1px solid var(--line);
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
    }
    .modalHead strong{ font-size: 14px; }
    .modalBody{ padding: 12px 14px; }
    .sigCanvasWrap{
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow:hidden;
      background: #fff;
      touch-action: none;
    }
    canvas{
      width:100%;
      height: 240px;
      display:block;
      background:#fff;
    }
    .modalFoot{
      padding: 12px 14px 14px;
      border-top: 1px solid var(--line);
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:space-between;
      align-items:center;
    }
    .modalHelp{
      color: var(--muted);
      font-weight: 800;
      font-size: 12px;
    }

    @media (max-width: 900px){
      .grid2{ grid-template-columns: 1fr; }
      .attRow{ grid-template-columns: 1fr; }
      canvas{ height: 220px; }
      .pillRow{ justify-content:flex-start; }
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>

<body>
  <div class="wrap">
    <div class="shell">
      <div id="app" class="card"></div>
    </div>
  </div>

  <!-- Signature Modal -->
  <div id="sigOverlay" class="modalOverlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-label="Signature">
      <div class="modalHead">
        <strong id="sigTitle">Signature</strong>
        <button id="sigCloseTop" class="btn btnGhost" type="button">Close</button>
      </div>

      <div class="modalBody">
        <div class="sigCanvasWrap">
          <canvas id="sigCanvas"></canvas>
        </div>
      </div>

      <div class="modalFoot">
        <div class="btnRow">
          <button id="sigClear" class="btn btnGhost" type="button">Clear</button>
          <button id="sigCancel" class="btn btnGhost" type="button">Cancel</button>
        </div>

        <div class="btnRow" style="align-items:center;">
          <span class="modalHelp">Draw with finger/mouse, then Save.</span>
          <button id="sigSave" class="btn btnYellow" type="button">Save signature</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function ensurePdfLib(){
      const check = () => !!window.PDFLib;
      if (check()) return;

      const s = document.createElement("script");
      s.src = "https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js";
      document.head.appendChild(s);
    })();
  </script>

  <script>
    const $ = (q) => document.querySelector(q);
    const el = (tag, attrs={}, children=[]) => {
      const n = document.createElement(tag);
      Object.entries(attrs).forEach(([k,v])=>{
        if(k === "class") n.className = v;
        else if(k === "html") n.innerHTML = v;
        else if(k.startsWith("on") && typeof v === "function") n.addEventListener(k.substring(2), v);
        else n.setAttribute(k, v);
      });
      children.forEach(c => n.appendChild(typeof c === "string" ? document.createTextNode(c) : c));
      return n;
    };

    const params = new URLSearchParams(location.search);
    const t = (params.get("t") || "Form").trim();
    document.title = t;

    const sigStore = new Map();
    const makeId = () => "id_" + Math.random().toString(16).slice(2) + "_" + Date.now().toString(16);

    const pad2 = (n) => String(n).padStart(2,"0");
    const todayISO = () => {
      const d = new Date();
      return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
    };
    const toDDMMYYYY = (iso) => {
      if(!iso || !iso.includes("-")) return iso || "";
      const [y,m,d] = iso.split("-");
      return `${pad2(d)}/${pad2(m)}/${y}`;
    };

    function showBanner(msg, type="warn"){
      const b = $("#banner");
      b.style.display = "block";
      b.style.borderColor = (type==="bad") ? "var(--badBd)" : "var(--warnBd)";
      b.style.background = (type==="bad") ? "var(--badBg)" : "var(--warnBg)";
      b.style.color = (type==="bad") ? "var(--badTx)" : "var(--warnTx)";
      b.textContent = msg;
    }
    function hideBanner(){
      const b = $("#banner");
      if(!b) return;
      b.style.display = "none";
      b.textContent = "";
    }

    function renderPlaceholder(title){
      const app = $("#app");
      app.innerHTML = "";
      app.appendChild(el("div",{class:"head"},[
        el("div",{},[
          el("h1",{},[title]),
          el("div",{class:"sub"},["This is a placeholder page."])
        ]),
        el("div",{class:"pillRow"},[
          el("a",{class:"btn btnYellow", href:"daily.html"},["Back"])
        ])
      ]));
    }

    const SigModal = (() => {
      const overlay = $("#sigOverlay");
      const canvas = $("#sigCanvas");
      const titleEl = $("#sigTitle");
      const btnClear = $("#sigClear");
      const btnCancel = $("#sigCancel");
      const btnSave = $("#sigSave");
      const btnCloseTop = $("#sigCloseTop");

      let ctx, drawing=false, hasInk=false;
      let currentAttId=null;
      let onSavedCb=null;

      const resizeCanvas = () => {
        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.floor(rect.width * dpr);
        canvas.height = Math.floor(rect.height * dpr);
        ctx = canvas.getContext("2d");
        ctx.setTransform(dpr,0,0,dpr,0,0);
        clearCanvas();
      };

      const clearCanvas = () => {
        if(!ctx) return;
        const rect = canvas.getBoundingClientRect();
        ctx.clearRect(0,0,rect.width,rect.height);
        ctx.fillStyle = "#fff";
        ctx.fillRect(0,0,rect.width,rect.height);
        ctx.strokeStyle = "#000";
        ctx.lineWidth = 2.4;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        hasInk = false;
      };

      const getPos = (evt) => {
        const rect = canvas.getBoundingClientRect();
        return { x: (evt.clientX - rect.left), y: (evt.clientY - rect.top) };
      };

      const start = (evt) => {
        evt.preventDefault();
        drawing = true;
        const p = getPos(evt);
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
      };

      const move = (evt) => {
        if(!drawing) return;
        evt.preventDefault();
        const p = getPos(evt);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
        hasInk = true;
      };

      const end = (evt) => {
        if(!drawing) return;
        evt.preventDefault();
        drawing = false;
      };

      canvas.addEventListener("pointerdown", start);
      canvas.addEventListener("pointermove", move);
      window.addEventListener("pointerup", end);
      window.addEventListener("pointercancel", end);

      btnClear.addEventListener("click", clearCanvas);

      const close = () => {
        overlay.style.display = "none";
        overlay.setAttribute("aria-hidden","true");
        currentAttId = null;
        onSavedCb = null;
      };

      btnCancel.addEventListener("click", close);
      btnCloseTop.addEventListener("click", close);

      btnSave.addEventListener("click", () => {
        if(!currentAttId) return;
        if(!hasInk){
          alert("Please sign first, then Save.");
          return;
        }
        const dataUrl = canvas.toDataURL("image/png");
        sigStore.set(currentAttId, dataUrl);
        if(typeof onSavedCb === "function") onSavedCb(currentAttId, dataUrl);
        close();
      });

      window.addEventListener("resize", () => {
        if(overlay.style.display === "flex") resizeCanvas();
      });

      const open = (attId, label, cb) => {
        currentAttId = attId;
        onSavedCb = cb;
        titleEl.textContent = label ? `Signature: ${label}` : "Signature";
        overlay.style.display = "flex";
        overlay.setAttribute("aria-hidden","false");
        setTimeout(resizeCanvas, 50);
      };

      return { open };
    })();

    async function checkTemplateAndLib(){
      const libPill = $("#pillLib");
      const tplPill = $("#pillTpl");

      await new Promise(r => setTimeout(r, 400));

      if(window.PDFLib){
        libPill.className = "pill ok";
        libPill.textContent = "PDF engine: OK";
      }else{
        libPill.className = "pill bad";
        libPill.textContent = "PDF engine: BLOCKED";
      }

      const tryFetch = async (url) => {
        try{
          const res = await fetch(url, { method:"GET", cache:"no-store" });
          return res.ok ? { ok:true, url } : { ok:false, status:res.status, url };
        }catch(e){
          return { ok:false, status:"ERR", url };
        }
      };

      let r = await tryFetch("/templates/daily-briefing.pdf");
      if(!r.ok) r = await tryFetch("templates/daily-briefing.pdf");

      if(r.ok){
        tplPill.className = "pill ok";
        tplPill.textContent = "Template: OK";
      }else{
        tplPill.className = "pill bad";
        tplPill.textContent = `Template: MISSING (${r.status})`;
      }
    }

    function renderDailyBrief(){
      const app = $("#app");
      app.innerHTML = "";

      const MAX_ATTENDEES = 96;

      const state = {
        projectTitle:"",
        siteLocation:"",
        workLocation:"",
        projectNo:"",
        brieferName:"",
        dateISO: todayISO(),
        jobTitle:"",
        prevPlanned:"Yes",
        prevConcerns:"",
        todayPlanned:"",
        covered:"Yes",
        controls:"Yes",
        ppe:"Yes",
        points:{
          confined:false, emergency:false, lifting:false, permits:false, plant:false, safetyPlanning:false,
          barriers:false, clearAccess:false, methodStatements:false, suitablePPE:false, trenchCollapse:false, welfare:false,
          coshh:false, fire:false, materials:false, competence:false, cables:false, trips:false
        },
        attendees:[ { id: makeId(), name:"", dateISO: todayISO() } ]
      };

      const head = el("div",{class:"head"},[
        el("div",{},[
          el("h1",{},["Daily Brief"]),
          el("div",{class:"sub"},["Fill it in, collect signatures per attendee, then download the PDF."])
        ]),
        el("div",{class:"pillRow"},[
          el("span",{id:"pillLib", class:"pill warn"},["PDF engine: checking…"]),
          el("span",{id:"pillTpl", class:"pill warn"},["Template: checking…"])
        ])
      ]);

      const banner = el("div",{id:"banner", class:"banner"},[""]);

      const sDetails = el("div",{class:"section"},[
        el("div",{class:"sectionTitle"},["Project & briefing details"]),
        el("div",{class:"grid2"},[
          field("Project title","projectTitle","text","e.g. Sizewell C"),
          field("Project no","projectNo","text","e.g. 836"),
          field("Site location","siteLocation","text","e.g. Sizewell"),
          field("Work location","workLocation","text","e.g. Cofferdams"),
          field("Name of person giving briefing","brieferName","text","e.g. Aureliu Nica"),
          field("Job title","jobTitle","text","e.g. Site Agent"),
          field("Date","dateISO","date",""),
          selectField("Did previous day go as planned?","prevPlanned",["Yes","No"])
        ])
      ]);

      const sBrief = el("div",{class:"section"},[
        el("div",{class:"sectionTitle"},["Briefing"]),
        el("div",{class:"grid2"},[
          textareaField("Any concerns from the previous day?","prevConcerns","Write concerns / issues / lessons learned…"),
          textareaField("Today's planned activities briefing","todayPlanned","What are we doing today? Key risks, controls, sequence…")
        ])
      ]);

      const sPoints = el("div",{class:"section"},[
        el("div",{class:"sectionTitle"},["Points discussed for today’s operation"]),
        el("div",{class:"grid3auto"},[
          chk("confined","Confined Spaces / Areas"),
          chk("emergency","Emergency Procedures"),
          chk("lifting","Lifting Equipment – Chains / Slings"),
          chk("permits","Permits to Work"),
          chk("plant","Plant & Equipment"),
          chk("safetyPlanning","Safety Planning"),
          chk("barriers","Barriers / Edge Protection"),
          chk("clearAccess","Clear Access Ways"),
          chk("methodStatements","Method Statements / Risk Assessments"),
          chk("suitablePPE","Suitable PPE"),
          chk("trenchCollapse","Trench Collapse"),
          chk("welfare","Welfare Facilities"),
          chk("coshh","COSHH Assessments"),
          chk("fire","Fire Precautions"),
          chk("materials","Materials"),
          chk("competence","Operative Experience / Competence"),
          chk("cables","Overhead / Underground Cable Strike"),
          chk("trips","Trips / Falls"),
        ])
      ]);

      const sConfirm = el("div",{class:"section"},[
        el("div",{class:"sectionTitle"},["Confirmations"]),
        el("div",{class:"grid2"},[
          selectField("Are all today’s activities covered by the procedure / MS / RA / WI?","covered",["Yes","No"]),
          selectField("Are all control measures in place?","controls",["Yes","No"]),
          selectField("Are all operatives compliant with PPE requirements?","ppe",["Yes","No"]),
        ])
      ]);

      const sAtt = el("div",{class:"section"},[
        el("div",{class:"attTop"},[
          el("div",{class:"sectionTitle", style:"margin:0;"},["Attendees (sign-up sheet)"]),
          el("button",{class:"btn btnGhost", type:"button", onclick:()=>addAttendee()},["+ Add attendee"])
        ]),
        el("div",{id:"attWrap"},[]),
        el("div",{class:"note"},[`PDF supports up to ${MAX_ATTENDEES} attendees (adds pages automatically).`])
      ]);

      const sticky = el("div",{class:"stickyBar"},[
        el("div",{class:"actionBar"},[
          el("div",{class:"btnRow"},[
            el("a",{class:"btn btnYellow", href:"daily.html"},["Back"]),
            el("span",{id:"attCount", class:"pill"},["Attendees: 0"])
          ]),
          el("div",{class:"btnRow"},[
            el("button",{id:"btnDownload", class:"btn", type:"button", onclick: async()=> {
              hideBanner();
              await onDownload();
            }},["Download PDF"])
          ])
        ])
      ]);

      app.appendChild(head);
      app.appendChild(banner);
      app.appendChild(sDetails);
      app.appendChild(sBrief);
      app.appendChild(sPoints);
      app.appendChild(sConfirm);
      app.appendChild(sAtt);
      app.appendChild(sticky);

      $("#prevPlanned").value = state.prevPlanned;
      $("#covered").value = state.covered;
      $("#controls").value = state.controls;
      $("#ppe").value = state.ppe;

      rebuildAttendees();
      updateAttCount();
      checkTemplateAndLib();

      function field(labelText, id, type, placeholder){
        return el("div",{},[
          el("label",{for:id},[labelText]),
          el("input",{id, type, placeholder})
        ]);
      }
      function textareaField(labelText, id, placeholder){
        return el("div",{},[
          el("label",{for:id},[labelText]),
          el("textarea",{id, placeholder})
        ]);
      }
      function selectField(labelText, id, options){
        return el("div",{},[
          el("label",{for:id},[labelText]),
          el("select",{id}, options.map(o=> el("option",{value:o},[o])) )
        ]);
      }
      function chk(key, labelText){
        const id = "pt_" + key;
        return el("label",{class:"check", for:id},[
          el("input",{type:"checkbox", id}),
          el("span",{},[labelText])
        ]);
      }

      function addAttendee(){
        const list = collectAttendees();
        if(list.length >= MAX_ATTENDEES){
          showBanner(`Max ${MAX_ATTENDEES} attendees.`, "warn");
          return;
        }
        list.push({ id: makeId(), name:"", dateISO: todayISO() });
        state.attendees = list;
        rebuildAttendees();
        updateAttCount();
      }

      function rebuildAttendees(){
        const wrap = $("#attWrap");
        wrap.innerHTML = "";
        const list = state.attendees;

        list.forEach((a, idx)=>{
          const sigUrl = sigStore.get(a.id) || "";

          const sigPreview = el("div",{class:"sigPreview", "data-prev":a.id},[
            sigUrl ? el("img",{src:sigUrl, alt:"Signature"}) : el("span",{},["No signature"])
          ]);

          const nameInput = el("input",{type:"text", value:a.name || "", placeholder:"Name", "data-name":a.id});
          const dateInput = el("input",{type:"date", value:a.dateISO || todayISO(), "data-date":a.id});

          nameInput.addEventListener("input", updateAttCount);

          const btnSign = el("button",{class:"btn btnGhost", type:"button", onclick:()=>{
            const nm = (nameInput.value || "").trim();
            SigModal.open(a.id, nm || `Attendee ${idx+1}`, (id, url)=>{
              const box = wrap.querySelector(`[data-prev="${id}"]`);
              if(box){
                box.innerHTML = "";
                box.appendChild(el("img",{src:url, alt:"Signature"}));
              }
            });
          }},["Sign"]);

          const btnClearSig = el("button",{class:"btn btnDanger", type:"button", onclick:()=>{
            sigStore.delete(a.id);
            const box = wrap.querySelector(`[data-prev="${a.id}"]`);
            if(box){
              box.innerHTML = "";
              box.appendChild(el("span",{},["No signature"]));
            }
          }},["Clear sig"]);

          const btnDelete = el("button",{class:"btn btnDanger", type:"button", onclick:()=>{
            const now = collectAttendees().filter(x=>x.id !== a.id);
            sigStore.delete(a.id);
            state.attendees = now.length ? now : [{ id: makeId(), name:"", dateISO: todayISO() }];
            rebuildAttendees();
            updateAttCount();
          }},["Delete"]);

          const row = el("div",{class:"attRow"},[
            el("div",{},[
              el("label",{},["Name"]),
              nameInput
            ]),
            el("div",{},[
              el("label",{},["Date"]),
              dateInput
            ]),
            el("div",{},[
              el("label",{},["Signature"]),
              sigPreview,
              el("div",{class:"btnRow", style:"margin-top:8px;"},[btnSign, btnClearSig])
            ]),
            el("div",{},[
              el("label",{},["Remove"]),
              btnDelete
            ])
          ]);

          wrap.appendChild(row);
        });
      }

      function collectAttendees(){
        const wrap = $("#attWrap");
        const rows = [...wrap.querySelectorAll(".attRow")];
        return rows.map(r=>{
          const nameInp = r.querySelector("input[data-name]");
          const dateInp = r.querySelector("input[data-date]");
          const id = nameInp.getAttribute("data-name");
          return {
            id,
            name: (nameInp.value || "").trim(),
            dateISO: (dateInp.value || todayISO()),
            signature: sigStore.get(id) || ""
          };
        });
      }

      function updateAttCount(){
        const count = collectAttendees().filter(a => a.name.length>0).length;
        $("#attCount").textContent = `Attendees: ${count}`;
      }

      function readForm(){
        const data = {
          projectTitle: $("#projectTitle").value.trim(),
          siteLocation: $("#siteLocation").value.trim(),
          workLocation: $("#workLocation").value.trim(),
          projectNo: $("#projectNo").value.trim(),
          brieferName: $("#brieferName").value.trim(),
          dateISO: $("#dateISO").value || todayISO(),
          jobTitle: $("#jobTitle").value.trim(),
          prevPlanned: $("#prevPlanned").value,
          prevConcerns: $("#prevConcerns").value.trim(),
          todayPlanned: $("#todayPlanned").value.trim(),
          covered: $("#covered").value,
          controls: $("#controls").value,
          ppe: $("#ppe").value,
          points: {}
        };

        Object.keys(state.points).forEach(k=>{
          const box = document.getElementById("pt_"+k);
          data.points[k] = !!(box && box.checked);
        });

        data.attendees = collectAttendees().filter(a => a.name.length>0);
        return data;
      }

      async function onDownload(){
        const btn = $("#btnDownload");
        btn.disabled = true;
        btn.textContent = "Generating…";
        try{
          const data = readForm();
          await generateDailyBriefPDF(data);
        }catch(err){
          showBanner(String(err && err.message ? err.message : err), "bad");
        }finally{
          btn.disabled = false;
          btn.textContent = "Download PDF";
        }
      }
    }

    async function generateDailyBriefPDF(data){
      if(!window.PDFLib){
        throw new Error("PDF engine is blocked (pdf-lib did not load). If you use a strict Content-Security-Policy, you must allow the CDN or host pdf-lib locally.");
      }

      const { PDFDocument, StandardFonts, rgb } = PDFLib;

      const pdfDoc = await PDFDocument.create();
      const helv = await pdfDoc.embedFont(StandardFonts.Helvetica);
      const helvBold = await pdfDoc.embedFont(StandardFonts.HelveticaBold);

      const A4 = [595.28, 841.89];
      const page1 = pdfDoc.addPage(A4);
      const page2 = pdfDoc.addPage(A4);

      const detectImageType = (bytes) => {
        if(!bytes || bytes.length < 4) return null;
        if(bytes[0] === 0xff && bytes[1] === 0xd8) return "jpeg";
        if(bytes[0] === 0x89 && bytes[1] === 0x50 && bytes[2] === 0x4e && bytes[3] === 0x47) return "png";
        return null;
      };

      const embedImageBytes = async (bytes) => {
        const type = detectImageType(bytes);
        if(type === "jpeg") return await pdfDoc.embedJpg(bytes);
        if(type === "png") return await pdfDoc.embedPng(bytes);
        return null;
      };

      async function fetchImage(url){
        try{
          const res = await fetch(url, { cache:"no-store" });
          if(!res.ok) return null;
          return new Uint8Array(await res.arrayBuffer());
        }catch(err){
          return null;
        }
      }

      let atlLogo;
      const atlBytes = await fetchImage("/atl-logo.png") || await fetchImage("atl-logo.png");
      if(atlBytes) atlLogo = await embedImageBytes(atlBytes);

      const RED = rgb(0.78, 0.1, 0.1);
      const HEADER_TEXT = rgb(1, 1, 1);
      const BLACK = rgb(0,0,0);
      const WHITE = rgb(1,1,1);
      const LIGHT_FILL = rgb(0.985, 0.985, 0.99);
      const YELLOW = rgb(1, 0.84, 0);

      const pad2 = (n) => String(n).padStart(2,"0");
      const todayISO = () => {
        const d = new Date();
        return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
      };
      const toDDMMYYYY = (iso) => {
        if(!iso || !iso.includes("-")) return iso || "";
        const [y,m,d] = iso.split("-");
        return `${pad2(d)}/${pad2(m)}/${y}`;
      };

      const drawText = (page, text, x, y, size=10, font=helvBold, color=BLACK) => {
        if(!text) return;
        page.drawText(String(text), { x, y, size, font, color });
      };

      const drawCenteredText = (page, text, centerX, y, size=12, font=helvBold, color=BLACK) => {
        if(!text) return;
        const width = font.widthOfTextAtSize(String(text), size);
        page.drawText(String(text), { x: centerX - (width / 2), y, size, font, color });
      };

      const drawCell = (page, x, y, w, h, { fill, border=1 } = {}) => {
        const opts = { x, y, width:w, height:h, borderColor: BLACK, borderWidth: border };
        if(fill) opts.color = fill;
        page.drawRectangle(opts);
      };

      const vCenterBaseline = (y, h, fontSize) => y + (h - fontSize) / 2 + 1.5;

      const drawTextInCell = (page, text, x, y, w, h, {
        size=10, font=helv, color=BLACK, padding=6, align="left"
      } = {}) => {
        if(!text && text !== 0) return;
        const s = String(text);
        let tx = x + padding;
        if(align === "center"){
          const tw = font.widthOfTextAtSize(s, size);
          tx = x + (w - tw) / 2;
        }else if(align === "right"){
          const tw = font.widthOfTextAtSize(s, size);
          tx = x + w - padding - tw;
        }
        const ty = vCenterBaseline(y, h, size);
        page.drawText(s, { x: tx, y: ty, size, font, color });
      };

      const wrapLines = (font, text, size, maxWidth) => {
        const words = String(text || "").replace(/\r/g,"").split(/\s+/).filter(Boolean);
        const lines = [];
        let line = "";
        for(const w of words){
          const test = line ? (line + " " + w) : w;
          const width = font.widthOfTextAtSize(test, size);
          if(width <= maxWidth) line = test;
          else { if(line) lines.push(line); line = w; }
        }
        if(line) lines.push(line);
        return lines;
      };

      const drawWrappedFromTop = (page, text, x, topY, maxWidth, lineHeight=12, size=10, maxLines=20, color=BLACK, font=helvBold) => {
        const lines = wrapLines(font, text, size, maxWidth).slice(0, maxLines);
        let y = topY;
        for(const ln of lines){
          page.drawText(ln, { x, y, size, font, color });
          y -= lineHeight;
        }
      };

      const drawWrappedCenteredInCell = (page, text, x, y, w, h, {
        size=8, font=helvBold, color=BLACK, padding=6, lineHeight=10, maxLines=3
      } = {}) => {
        const maxWidth = w - padding*2;
        const lines = wrapLines(font, text, size, maxWidth).slice(0, maxLines);
        const totalH = lines.length * lineHeight;
        let baseline = y + (h + totalH) / 2 - size; // centre block
        for(let i=0;i<lines.length;i++){
          page.drawText(lines[i], { x: x + padding, y: baseline - i*lineHeight, size, font, color });
        }
      };

      const fitFontSizeToWidth = (font, text, startSize, maxWidth, minSize=6.2) => {
        let size = startSize;
        const t = String(text || "");
        while(size > minSize && font.widthOfTextAtSize(t, size) > maxWidth){
          size -= 0.2;
        }
        return Math.max(minSize, size);
      };

      // ✅ ONLY ONE BOX: YES or NO (yellow)
      const drawYesNoSingle = (page, x, y, w, h, value) => {
        const v = String(value || "").trim().toUpperCase() === "NO" ? "NO" : "YES";
        const pad = 2;
        const boxH = Math.min(14, h - 4);
        const boxW = Math.min(44, w - 4);
        const bx = x + w - boxW - pad;
        const by = y + (h - boxH) / 2;

        drawCell(page, bx, by, boxW, boxH, { fill: YELLOW, border: 1 });
        drawTextInCell(page, v, bx, by, boxW, boxH, { size:7.4, font:helvBold, align:"center" });
      };

      const drawCheckmark = (page, boxX, boxY, boxW, boxH) => {
        const centerX = boxX + (boxW / 2);
        const centerY = boxY + (boxH / 2);
        const radius = Math.min(boxW, boxH) * 0.28;
        page.drawCircle({ x: centerX, y: centerY, size: radius, color: BLACK });
      };

      const ddmmyyyy = toDDMMYYYY(data.dateISO);
      const attendeesCount = (data.attendees || []).length;

      function drawHeader(page){
        if(atlLogo){
          const scale = 140 / atlLogo.width;
          page.drawImage(atlLogo, { x:40, y:760, width: atlLogo.width * scale, height: atlLogo.height * scale });
        }
        drawText(page, "ATL Daily Task Briefing", 430, 795, 9, helvBold, RED);
        drawText(page, "QPFS12.4", 430, 783, 9, helvBold, RED);
        drawCell(page, 40, 705, 515, 22, { fill: RED, border: 1 });
        drawCenteredText(page, "HEALTH & SAFETY - MORNING BRIEFING", 297.5, 712, 12, helvBold, HEADER_TEXT);
      }

      function drawIntroTable(page){
        const marginX = 40;
        const tableTop = 680;
        const rowH = 26;
        const labelW = 140;
        const valueW = 190;
        const label2W = 110;
        const value2W = 75;

        const rows = [
          ["PROJECT TITLE", data.projectTitle, "SITE LOCATION", data.siteLocation],
          ["Work Location", data.workLocation, "Project no:", data.projectNo],
          ["NAME OF PERSON\nGIVING BRIEFING", data.brieferName, "DATE", ddmmyyyy],
          ["JOB TITLE", data.jobTitle, "NO. OF PERSONS\nATTENDING BRIEFING", String(attendeesCount || "")]
        ];

        rows.forEach((row, i) => {
          const y = tableTop - (rowH * (i + 1));

          drawCell(page, marginX, y, labelW, rowH);
          drawCell(page, marginX + labelW, y, valueW, rowH, { fill: LIGHT_FILL });

          drawCell(page, marginX + labelW + valueW, y, label2W, rowH);
          drawCell(page, marginX + labelW + valueW + label2W, y, value2W, rowH, { fill: LIGHT_FILL });

          drawWrappedFromTop(page, row[0], marginX + 6, y + rowH - 9, labelW - 10, 10, 8, 2, BLACK, helvBold);

          // ✅ left aligned + vertically centred
          drawTextInCell(page, row[1], marginX + labelW, y, valueW, rowH, { size:10, font:helv, align:"left" });

          drawWrappedFromTop(page, row[2], marginX + labelW + valueW + 6, y + rowH - 9, label2W - 10, 10, 8, 2, BLACK, helvBold);

          drawTextInCell(page, row[3], marginX + labelW + valueW + label2W, y, value2W, rowH, { size:10, font:helv, align:"left" });
        });

        return tableTop - (rowH * rows.length) - 10;
      }

      function drawPreviousDay(page, startY){
        const marginX = 40;
        const headerH = 20;

        drawCell(page, marginX, startY - headerH, 395, headerH, { fill: RED });
        drawCell(page, marginX + 395, startY - headerH, 120, headerH, { fill: RED });

        drawTextInCell(page, "PREVIOUS DAY'S ACTIVITIES", marginX, startY - headerH, 395, headerH, { size:9, font:helvBold, color:HEADER_TEXT });

        // Right header text
        drawWrappedFromTop(page, "DID THEY GO AS\nPLANNED?", marginX + 395 + 6, startY - 6, 70, 9, 7.2, 2, HEADER_TEXT, helvBold);

        // ✅ ONLY ONE value (YES or NO)
        drawYesNoSingle(page, marginX + 395, startY - headerH, 120, headerH, data.prevPlanned);

        const qRowH = 24;
        const aRowH = 64;

        const qY = startY - headerH - qRowH;
        drawCell(page, marginX, qY, 515, qRowH);
        drawTextInCell(page, "Any concerns from the previous day?", marginX, qY, 515, qRowH, { size:9.2, font:helvBold });

        const aY = qY - aRowH;
        drawCell(page, marginX, aY, 515, aRowH, { fill: LIGHT_FILL });
        drawWrappedFromTop(page, data.prevConcerns, marginX + 6, aY + aRowH - 10, 500, 12, 10, 5, BLACK, helv);

        return aY - 12;
      }

      function drawTodayPlanned(page, startY){
        const marginX = 40;
        const headerH = 18;

        drawCell(page, marginX, startY - headerH, 515, headerH, { fill: RED });
        drawTextInCell(page, "TODAY'S PLANNED ACTIVITIES BRIEFING", marginX, startY - headerH, 515, headerH, { size:9, font:helvBold, color:HEADER_TEXT });

        const bodyH = 110;
        const bodyY = startY - headerH - bodyH;

        drawCell(page, marginX, bodyY, 515, bodyH, { fill: LIGHT_FILL });
        drawWrappedFromTop(page, data.todayPlanned, marginX + 6, bodyY + bodyH - 10, 500, 12, 10, 8, BLACK, helv);

        return bodyY - 14;
      }

      function drawPointsGrid(page, startY){
        const marginX = 40;
        const headerH = 16;

        drawCell(page, marginX, startY - headerH, 515, headerH, { fill: RED });
        drawTextInCell(page, "Points discussed for today's operation:", marginX, startY - headerH, 515, headerH, { size:8, font:helvBold, color:HEADER_TEXT });

        const rowH = 18;
        const colGroups = [
          { labelW: 150, checkW: 20 },
          { labelW: 150, checkW: 20 },
          { labelW: 155, checkW: 20 }
        ];

        const rows = [
          ["confined", "barriers", "coshh"],
          ["emergency", "clearAccess", "fire"],
          ["lifting", "methodStatements", "materials"],
          ["permits", "suitablePPE", "competence"],
          ["plant", "trenchCollapse", "cables"],
          ["safetyPlanning", "welfare", "trips"],
        ];

        const labels = {
          confined: "Confined Spaces / Areas",
          emergency: "Emergency Procedures",
          lifting: "Lifting Equipment – Chains / Slings",
          permits: "Permits to Work",
          plant: "Plant & Equipment",
          safetyPlanning: "Safety Planning",
          barriers: "Barriers / Edge Protection",
          clearAccess: "Clear Access Ways",
          methodStatements: "Method Statements / Risk Assessments",
          suitablePPE: "Suitable PPE",
          trenchCollapse: "Trench Collapse",
          welfare: "Welfare Facilities",
          coshh: "COSHH Assessments",
          fire: "Fire Precautions",
          materials: "Materials",
          competence: "Operative Experience / Competence",
          cables: "Overhead / Underground Cable Strike",
          trips: "Trips / Falls"
        };

        let y = startY - headerH;

        rows.forEach((row) => {
          y -= rowH;
          let x = marginX;

          row.forEach((key, idx) => {
            const group = colGroups[idx];
            drawCell(page, x, y, group.labelW, rowH);
            drawCell(page, x + group.labelW, y, group.checkW, rowH, { fill: LIGHT_FILL });

            // ✅ vertically centred + left aligned (fixes "too top")
            const txt = labels[key];
            const maxW = group.labelW - 12;
            const size = fitFontSizeToWidth(helvBold, txt, 8.0, maxW, 6.4);
            drawTextInCell(page, txt, x, y, group.labelW, rowH, { size, font:helvBold, align:"left" });

            if(data.points && data.points[key]){
              drawCheckmark(page, x + group.labelW + 2, y + 3, group.checkW - 4, rowH - 6);
            }

            x += group.labelW + group.checkW;
          });
        });

        const footerH = 16;
        const footerY = y - 2 - footerH;
        drawCell(page, marginX, footerY, 515, footerH, { fill: RED });
        drawCenteredText(page, "This list is not exhaustive  -  REMEMBER – MANAGE HEALTH & SAFETY", 297.5, footerY + 4, 8, helvBold, HEADER_TEXT);

        return footerY - 4;
      }

      function drawConfirmations(page, startY){
        const marginX = 40;
        const rowH = 28;
        const textW = 460;
        const boxW = 55;

        const items = [
          { text: "Are all today's activities covered by the Operation Procedure / Method Statement / Risk Assessment / Work Instruction?", value: data.covered },
          { text: "Are all Control Measures in place?", value: data.controls },
          { text: "Are all operatives compliant with the site requirements for PPE?", value: data.ppe }
        ];

        let y = startY;

        items.forEach(item => {
          y -= rowH;
          drawCell(page, marginX, y, textW, rowH);
          drawCell(page, marginX + textW, y, boxW, rowH);

          // ✅ centred vertically inside cell (multi-line)
          drawWrappedCenteredInCell(page, item.text, marginX, y, textW, rowH, {
            size:7.4, font:helvBold, padding:6, lineHeight:9.4, maxLines:3
          });

          // ✅ ONLY ONE value (YES or NO)
          drawYesNoSingle(page, marginX + textW, y, boxW, rowH, item.value);
        });
      }

      function drawSignUpPage(page){
        drawHeader(page);

        drawCell(page, 40, 675, 515, 20, { fill: RED });
        drawCenteredText(page, "HEALTH & SAFETY – MORNING BRIEFING SIGN-UP Sheet", 297.5, 680, 9, helvBold, HEADER_TEXT);

        drawCell(page, 40, 645, 515, 30);
        drawWrappedFromTop(
          page,
          "Signing of this briefing confirms that all control measures defined in the associated risk assessments are in place, anyone joining the working group must be briefed prior to starting",
          50, 668, 495, 10, 8, 3, BLACK, helv
        );

        drawCell(page, 40, 632, 515, 20, { fill: RED });
        drawCenteredText(page, "ATTENDEES", 297.5, 637, 8, helvBold, HEADER_TEXT);
      }

      async function drawAttendeeTable(page, startY, attendees, startIndex){
        const marginX = 40;

        // ✅ more rows to near the bottom
        const rowH = 18;
        const rowsPerPage = 32;

        const nameW = 250;
        const dateW = 110;
        const sigW = 155;

        const headerY = startY;

        drawCell(page, marginX, headerY, nameW, rowH, { fill: RED });
        drawCell(page, marginX + nameW, headerY, dateW, rowH, { fill: RED });
        drawCell(page, marginX + nameW + dateW, headerY, sigW, rowH, { fill: RED });

        drawTextInCell(page, "NAME", marginX, headerY, nameW, rowH, { size:8, font:helvBold, color:HEADER_TEXT, align:"left" });
        drawTextInCell(page, "DATE", marginX + nameW, headerY, dateW, rowH, { size:8, font:helvBold, color:HEADER_TEXT, align:"left" });
        drawTextInCell(page, "SIGNATURE", marginX + nameW + dateW, headerY, sigW, rowH, { size:8, font:helvBold, color:HEADER_TEXT, align:"left" });

        const fitInto = (imgW, imgH, maxW, maxH) => {
          const r = Math.min(maxW / imgW, maxH / imgH);
          return { w: imgW * r, h: imgH * r };
        };

        const decodeDataUrl = (dataUrl) => {
          if(!dataUrl || typeof dataUrl !== "string") return null;
          const match = dataUrl.match(/^data:(image\/(png|jpeg|jpg));base64,(.+)$/i);
          if(!match) return null;
          const b64 = match[3];
          if(!b64) return null;
          const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
          return { bytes };
        };

        const embedImageFromDataUrl = async (dataUrl) => {
          const decoded = decodeDataUrl(dataUrl);
          if(!decoded) return null;
          return await embedImageBytes(decoded.bytes);
        };

        let y = headerY - rowH;
        let idx = startIndex;

        for(let i=0;i<rowsPerPage;i++){
          drawCell(page, marginX, y, nameW, rowH, { fill: LIGHT_FILL });
          drawCell(page, marginX + nameW, y, dateW, rowH, { fill: LIGHT_FILL });
          drawCell(page, marginX + nameW + dateW, y, sigW, rowH, { fill: LIGHT_FILL });

          const a = attendees[idx];
          if(a){
            drawTextInCell(page, a.name, marginX, y, nameW, rowH, { size:9.4, font:helv, align:"left" });
            drawTextInCell(page, toDDMMYYYY(a.dateISO), marginX + nameW, y, dateW, rowH, { size:9.4, font:helv, align:"left" });

            if(a.signature){
              const embed = await embedImageFromDataUrl(a.signature);
              if(embed){
                const maxW = sigW - 10;
                const maxH = rowH - 4;
                const s = fitInto(embed.width, embed.height, maxW, maxH);
                const xImg = marginX + nameW + dateW + 5 + ((maxW - s.w) / 2);
                const yImg = y + 2 + ((maxH - s.h) / 2);
                page.drawImage(embed, { x: xImg, y: yImg, width:s.w, height:s.h });
              }
            }
            idx++;
          }
          y -= rowH;
        }
        return idx;
      }

      const addPageFooter = (page, pageIndex, totalPages) => {
        drawText(page, "QPFS12.4", 40, 24, 9, helvBold, BLACK);
        drawText(page, `Page No. ${pageIndex} of ${totalPages}`, 455, 24, 9, helvBold, BLACK);
      };

      drawHeader(page1);
      let cursorY = drawIntroTable(page1);
      cursorY = drawPreviousDay(page1, cursorY);
      cursorY = drawTodayPlanned(page1, cursorY);
      cursorY = drawPointsGrid(page1, cursorY);
      drawConfirmations(page1, cursorY);

      drawSignUpPage(page2);

      const MAX_PDF_ATTENDEES = 96;
      const attendeesAll = (data.attendees || []).slice(0, MAX_PDF_ATTENDEES).map(a=>({
        name: (a.name||"").trim(),
        dateISO: (a.dateISO||data.dateISO||todayISO()),
        signature: (a.signature||"")
      }));

      let next = await drawAttendeeTable(page2, 612, attendeesAll, 0);

      while(next < attendeesAll.length){
        const p = pdfDoc.addPage(A4);
        drawSignUpPage(p);
        next = await drawAttendeeTable(p, 612, attendeesAll, next);
      }

      const pages = pdfDoc.getPages();
      pages.forEach((p, idx) => addPageFooter(p, idx + 1, pages.length));

      const outBytes = await pdfDoc.save();
      const blob = new Blob([outBytes], { type:"application/pdf" });
      const url = URL.createObjectURL(blob);
      const filename = `Daily-Briefing_${data.dateISO || todayISO()}.pdf`;

      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.rel = "noopener";
      document.body.appendChild(a);
      a.click();
      a.remove();

      setTimeout(()=> URL.revokeObjectURL(url), 2500);
    }

    if(t.toLowerCase() === "daily brief" || t.toLowerCase() === "daily briefing"){
      renderDailyBrief();
    }else{
      renderPlaceholder(t);
    }
  </script>
</body>
</html>
