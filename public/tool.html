<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Form</title>

  <style>
    :root{
      --bg:#f6f7f9;
      --card:#ffffff;
      --text:#111111;
      --muted:#6b7280;
      --line:#e5e7eb;
      --yellow:#ffd600;
      --radius:18px;

      --btn:#111;
      --btnText:#fff;

      --okBg:#ecfdf5;    --okBd:#a7f3d0;  --okTx:#065f46;
      --badBg:#fef2f2;   --badBd:#fecaca; --badTx:#7f1d1d;
      --warnBg:#fffbeb;  --warnBd:#fde68a;--warnTx:#92400e;
    }

    *{ box-sizing:border-box; }
    html, body{ width:100%; max-width:100%; overflow-x:hidden; }

    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap{ max-width: 980px; margin: 16px auto; padding: 0 14px; }
    .shell{
      border: 1px solid #e8eaee;
      border-radius: 24px;
      padding: 10px;
      box-shadow: 0 8px 22px rgba(0,0,0,.05);
      background: transparent;
    }

    .card{
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
    }

    .head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
    }
    h1{
      margin:0;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: .2px;
    }
    .sub{
      margin:6px 0 0;
      color: var(--muted);
      font-weight: 700;
      font-size: 13px;
      line-height: 1.35;
    }

    .pillRow{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      justify-content:flex-end;
      align-items:center;
      margin-top: 2px;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 7px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background:#fff;
      color: var(--muted);
      font-weight: 800;
      font-size: 12px;
      white-space:nowrap;
    }
    .pill.ok{ background: var(--okBg); border-color: var(--okBd); color: var(--okTx); }
    .pill.bad{ background: var(--badBg); border-color: var(--badBd); color: var(--badTx); }
    .pill.warn{ background: var(--warnBg); border-color: var(--warnBd); color: var(--warnTx); }

    .banner{
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid var(--warnBd);
      background: var(--warnBg);
      color: var(--warnTx);
      font-weight: 800;
      font-size: 13px;
      display:none;
    }

    .section{
      margin-top: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      background:#fff;
    }
    .sectionTitle{
      margin:0 0 10px;
      font-weight: 900;
      font-size: 13px;
      letter-spacing:.2px;
      color:#111;
    }

    label{
      display:block;
      font-size: 12px;
      font-weight: 800;
      color:#111;
      margin: 0 0 6px;
    }
    input, select, textarea{
      width:100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
      background:#fff;
    }
    textarea{ min-height: 92px; resize: vertical; }

    .grid2{
      display:grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .grid3auto{
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 10px;
    }

    .check{
      display:flex;
      align-items:center;
      gap:10px;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px 12px;
      background:#fff;
      font-weight: 800;
      font-size: 13px;
    }
    .check input{ width:18px; height:18px; }

    .attTop{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom: 10px;
    }

    .attRow{
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px;
      background:#fff;
      margin-top: 10px;
      display:grid;
      grid-template-columns: 2fr 1fr 2fr 1.2fr;
      gap: 10px;
      align-items:end;
    }

    .sigPreview{
      height: 44px;
      border: 1px dashed var(--line);
      border-radius: 12px;
      background:#fafafa;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }
    .sigPreview img{
      width:100%;
      height:100%;
      object-fit: contain;
      background:#fff;
    }
    .sigPreview span{
      color: var(--muted);
      font-weight: 800;
      font-size: 12px;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border-radius: 999px;
      padding: 10px 16px;
      font-weight: 900;
      text-decoration:none;
      cursor:pointer;
      border: 1px solid rgba(0,0,0,.10);
      box-shadow: 0 2px 0 rgba(0,0,0,.10);
      user-select:none;
      background: var(--btn);
      color: var(--btnText);
      white-space:nowrap;
    }
    .btn:active{ transform: translateY(1px); }
    .btnYellow{
      background: var(--yellow);
      border-color: #caa900;
      color:#111;
    }
    .btnGhost{
      background:#fff;
      color:#111;
      border:1px solid var(--line);
      box-shadow:none;
    }
    .btnDanger{
      background:#fff;
      color: #7f1d1d;
      border:1px solid #fecaca;
      box-shadow:none;
      font-weight: 900;
    }

    .btnRow{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .stickyBar{
      position: sticky;
      bottom: 0;
      margin-top: 14px;
      padding-top: 12px;
      background: linear-gradient(to top, rgba(246,247,249,1), rgba(246,247,249,.0));
    }

    .actionBar{
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:#fff;
      padding: 10px;
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
      flex-wrap:wrap;
    }

    .note{
      margin-top: 10px;
      color: var(--muted);
      font-weight: 700;
      font-size: 12px;
      line-height: 1.35;
    }

    /* Signature modal */
    .modalOverlay{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.40);
      display:none;
      align-items:center;
      justify-content:center;
      padding: 14px;
      z-index: 50;
    }
    .modal{
      width: min(760px, 100%);
      background: #fff;
      border-radius: 18px;
      border: 1px solid var(--line);
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
      overflow:hidden;
    }
    .modalHead{
      padding: 14px;
      border-bottom: 1px solid var(--line);
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
    }
    .modalHead strong{ font-size: 14px; }
    .modalBody{ padding: 12px 14px; }
    .sigCanvasWrap{
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow:hidden;
      background: #fff;
      touch-action: none;
    }
    canvas{
      width:100%;
      height: 240px;
      display:block;
      background:#fff;
    }
    .modalFoot{
      padding: 12px 14px 14px;
      border-top: 1px solid var(--line);
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:space-between;
      align-items:center;
    }
    .modalHelp{
      color: var(--muted);
      font-weight: 800;
      font-size: 12px;
    }

    @media (max-width: 900px){
      .grid2{ grid-template-columns: 1fr; }
      .attRow{ grid-template-columns: 1fr; }
      canvas{ height: 220px; }
      .pillRow{ justify-content:flex-start; }
    }
  </style>

  <script src="tool.js?v=20260204-3" defer></script>
</head>

<body>
  <div class="wrap">
    <div class="shell">
      <div id="app" class="card"></div>
    </div>
  </div>

  <!-- Signature Modal -->
  <div id="sigOverlay" class="modalOverlay" aria-hidden="true" tabindex="-1">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="sigTitle">
      <div class="modalHead">
        <strong id="sigTitle">Signature</strong>
        <button id="sigCloseTop" class="btn btnGhost" type="button" aria-label="Close signature modal">Close</button>
      </div>

      <div class="modalBody">
        <div class="sigCanvasWrap">
          <canvas id="sigCanvas" aria-label="Signature drawing area" tabindex="0" role="region"></canvas>
        </div>
      </div>

      <div class="modalFoot">
        <div class="btnRow">
          <button id="sigClear" class="btn btnGhost" type="button" aria-label="Clear signature">Clear</button>
          <button id="sigCancel" class="btn btnGhost" type="button" aria-label="Cancel signature">Cancel</button>
        </div>

        <div class="btnRow" style="align-items:center;">
          <span class="modalHelp" id="sigHelp">Draw with finger or mouse, then Save.</span>
          <button id="sigSave" class="btn btnYellow" type="button" aria-label="Save signature">Save signature</button>
        </div>
      </div>
    </div>
  </div>
  <script defer>
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        if (!window.__toolReady) {
          const app = document.querySelector('#app');
          if (app) {
            app.innerHTML = '';
            const box = document.createElement('div');
            box.style.border = '1px solid #fecaca';
            box.style.background = '#fef2f2';
            box.style.color = '#7f1d1d';
            box.style.borderRadius = '14px';
            box.style.padding = '12px 14px';
            box.style.fontWeight = '800';
            box.textContent = 'The form failed to load. Please hard refresh (Ctrl+F5) or clear cache.';
            app.appendChild(box);
          }
        }
      }, 800);
    });
  </script>
</body>
</html>
