<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Form</title>

  <style>
    :root{
      --bg:#f6f7f9;
      --panel:#ffffff;
      --text:#111111;
      --muted:#6b7280;
      --line:#e5e7eb;
      --yellow:#ffd600;
      --radius:22px;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap{ max-width:980px; margin:18px auto; padding:0 14px; }
    .shell{ border:1px solid #e8eaee; border-radius:26px; padding:10px; box-shadow:0 6px 18px rgba(0,0,0,.04); }
    .card{
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
    }
    h1{ margin:0 0 8px; font-size:22px; font-weight:900; }
    p{ margin:0 0 14px; color: var(--muted); font-weight:700; }
    .btn{
      display:inline-block;
      background: var(--yellow);
      border: 1px solid #caa900;
      color:#111;
      padding: 10px 16px;
      border-radius: 999px;
      text-decoration:none;
      font-weight: 900;
      box-shadow: 0 2px 0 rgba(0,0,0,.10);
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="shell">
      <div class="card">
        <h1 id="title">Form</h1>
        <p>This is a placeholder page. Next step: we connect this to the actual form/PDF and save/export logic.</p>
        <a class="btn" href="daily.html">Back</a>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const t = params.get("t") || "Form";
    document.title = t;
    document.getElementById("title").textContent = t;
  </script>
</body>
</html>
