<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Plant Pre-Use Inspection Checklist</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#111111" />

  <style>
    :root{
      --bg:#f6f7f9;
      --panel:#ffffff;
      --text:#111111;
      --muted:#6b7280;
      --line:#e5e7eb;
      --cardLine:#2f2f2f;
      --yellow:#ffd600;
      --radius:22px;
    }

    *{ box-sizing:border-box; }
    html, body{ width:100%; max-width:100%; overflow-x:hidden; }

    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap{
      max-width: 980px;
      margin: 18px auto 28px;
      padding: 0 14px;
    }

    .shell{
      background: transparent;
      border-radius: 26px;
      padding: 10px;
      border: 1px solid #e8eaee;
      box-shadow: 0 6px 18px rgba(0,0,0,.04);
    }

    .hero{
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 22px 18px 18px;
      position: relative;
      min-height: 150px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
    }

    .logo{
      position:absolute;
      top: 18px;
      height: 48px;
      width:auto;
      object-fit: contain;
      user-select:none;
      -webkit-user-drag:none;
    }
    .logo.left{ left: 18px; }
    .logo.right{ right: 18px; }

    h1{
      margin: 8px 0 14px;
      font-size: 26px;
      letter-spacing: .2px;
      font-weight: 800;
    }

    .cta{
      display:inline-block;
      background: var(--yellow);
      color: #111;
      border: 1px solid #caa900;
      padding: 10px 18px;
      border-radius: 999px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 2px 0 rgba(0,0,0,.10);
      transition: transform .08s ease;
    }
    .cta:active{ transform: translateY(1px); }

    .grid{
      margin-top: 16px;
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .choice{
      background: var(--panel);
      border: 1.8px solid var(--cardLine);
      border-radius: 18px;
      padding: 18px 18px 16px;
      text-decoration:none;
      color: inherit;
      text-align:center;
      box-shadow: 0 2px 0 rgba(0,0,0,.06);
      transition: transform .10s ease, box-shadow .10s ease;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      min-height: 210px;
    }
    .choice:hover{
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(0,0,0,.08);
    }

    .icon{
      width: 140px;
      height: 84px;
      display:flex;
      align-items:center;
      justify-content:center;
      margin-top: 2px;
      margin-bottom: 10px;
    }

    .choiceTitle{
      font-size: 22px;
      font-weight: 900;
      margin: 2px 0 6px;
    }

    .choiceSub{
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: .2px;
    }

    /* Responsive */
    @media (max-width: 860px){
      .grid{ grid-template-columns: 1fr; }
      .hero{ padding-top: 66px; }
      .logo{ top: 14px; height: 42px; }
      .logo.left{ left: 14px; }
      .logo.right{ right: 14px; }
      h1{ font-size: 22px; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="shell">
      <section class="hero">
        <img class="logo left" src="assets/atl-logo.png" alt="Active Tunnelling" />
        <img class="logo right" src="assets/tp-logo.png" alt="TP" />

        <div>
          <h1>Plant Pre-Use Inspection Checklist</h1>
          <a class="cta" href="#choices">Choose check type to start</a>
        </div>
      </section>

      <main id="choices" class="grid" aria-label="Choose check type">
        <a class="choice" href="daily.html" aria-label="Daily Checks">
          <div class="icon" aria-hidden="true">
            <!-- Calendar + 1 -->
            <svg viewBox="0 0 220 120" width="140" height="84">
              <rect x="28" y="24" width="150" height="82" rx="14" fill="none" stroke="var(--yellow)" stroke-width="6"/>
              <line x1="28" y1="46" x2="178" y2="46" stroke="var(--yellow)" stroke-width="6"/>
              <line x1="62" y1="16" x2="62" y2="38" stroke="var(--yellow)" stroke-width="10" stroke-linecap="round"/>
              <line x1="144" y1="16" x2="144" y2="38" stroke="var(--yellow)" stroke-width="10" stroke-linecap="round"/>
              <text x="102" y="88" text-anchor="middle" font-size="44" font-weight="900" fill="var(--yellow)" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial">1</text>
            </svg>
          </div>
          <div class="choiceTitle">Daily Checks</div>
          <div class="choiceSub">Frequency: DAILY</div>
        </a>

        <a class="choice" href="weekly.html" aria-label="Weekly Checks">
          <div class="icon" aria-hidden="true">
            <!-- Calendar + 7 -->
            <svg viewBox="0 0 220 120" width="140" height="84">
              <rect x="28" y="24" width="150" height="82" rx="14" fill="none" stroke="var(--yellow)" stroke-width="6"/>
              <line x1="28" y1="46" x2="178" y2="46" stroke="var(--yellow)" stroke-width="6"/>
              <line x1="62" y1="16" x2="62" y2="38" stroke="var(--yellow)" stroke-width="10" stroke-linecap="round"/>
              <line x1="144" y1="16" x2="144" y2="38" stroke="var(--yellow)" stroke-width="10" stroke-linecap="round"/>
              <text x="102" y="88" text-anchor="middle" font-size="44" font-weight="900" fill="var(--yellow)" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial">7</text>
            </svg>
          </div>
          <div class="choiceTitle">Weekly Checks</div>
          <div class="choiceSub">Frequency: WEEKLY</div>
        </a>

        <a class="choice" href="monthly.html" aria-label="Monthly Checks">
          <div class="icon" aria-hidden="true">
            <!-- Calendar + 30 -->
            <svg viewBox="0 0 220 120" width="140" height="84">
              <rect x="28" y="24" width="150" height="82" rx="14" fill="none" stroke="var(--yellow)" stroke-width="6"/>
              <line x1="28" y1="46" x2="178" y2="46" stroke="var(--yellow)" stroke-width="6"/>
              <line x1="62" y1="16" x2="62" y2="38" stroke="var(--yellow)" stroke-width="10" stroke-linecap="round"/>
              <line x1="144" y1="16" x2="144" y2="38" stroke="var(--yellow)" stroke-width="10" stroke-linecap="round"/>
              <text x="102" y="88" text-anchor="middle" font-size="40" font-weight="900" fill="var(--yellow)" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial">30</text>
            </svg>
          </div>
          <div class="choiceTitle">Monthly Checks</div>
          <div class="choiceSub">Frequency: MONTHLY</div>
        </a>
      </main>
    </div>
  </div>
</body>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js");
    });
  }
</script>
</html>
