<!-- public/index.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Red Folder ATL</title>

  <style>
    :root{
      --bg:#f6f7f9;
      --card:#ffffff;
      --text:#111827;
      --muted:#6b7280;
      --line:#e5e7eb;
      --yellow:#ffd600;
      --black:#111;
      --radius:16px;
      --shadow: 0 10px 25px rgba(0,0,0,.08);
    }
    *{ box-sizing:border-box; }
    html, body{ width:100%; max-width:100%; overflow-x:hidden; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color:var(--text);
      background:var(--bg);
    }

    .topbar{
      position:sticky; top:0; z-index:50;
      background:var(--card);
      border-bottom:1px solid var(--line);
    }
    .topbarInner{
      max-width:1100px;
      margin:0 auto;
      padding:14px 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .brand{ display:flex; align-items:center; gap:10px; min-width:0; }
    .badge{
      display:inline-flex; align-items:center; justify-content:center;
      width:34px; height:34px;
      border-radius:10px;
      background:var(--yellow);
      color:#111;
      font-weight:800;
      letter-spacing:.3px;
    }
    .brandTitle{
      font-weight:800;
      letter-spacing:.2px;
      font-size:16px;
      line-height:1.1;
    }
    .brandSub{
      font-size:12px;
      color:var(--muted);
      margin-top:2px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:58vw;
    }
    .rightTools{
      display:flex; align-items:center; gap:8px; flex-shrink:0;
    }

    .wrap{ max-width:1100px; margin:0 auto; padding:16px; }
    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    .cardHead{
      padding:16px;
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
    }
    .h1{ margin:0; font-size:18px; letter-spacing:.2px; }
    .sub{ margin:6px 0 0; font-size:13px; color:var(--muted); line-height:1.3; }
    .cardBody{ padding:16px; }

    .btnRow{
      display:flex; flex-wrap:wrap;
      gap:10px;
      justify-content:flex-end;
      align-items:center;
    }

    .btn, .btnAlt, .btnGhost, .linkBtn{
      border:0;
      border-radius:12px;
      padding:10px 12px;
      font-weight:700;
      font-size:13px;
      cursor:pointer;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      line-height:1;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    .btn{ background:var(--black); color:#fff; }
    .btnAlt{ background:#f3f4f6; color:var(--text); border:1px solid var(--line); }
    .btnGhost{ background:transparent; color:var(--text); border:1px solid var(--line); }
    .linkBtn{ background:#fff; color:var(--text); border:1px solid var(--line); }

    .tiles{
      display:grid;
      grid-template-columns:1fr;
      gap:12px;
    }
    @media (min-width: 820px){
      .tiles{ grid-template-columns:1fr 1fr; }
    }
    .tile{
      border:1px solid var(--line);
      border-radius:16px;
      background:#fff;
      padding:14px;
      display:flex;
      gap:12px;
      align-items:flex-start;
      justify-content:space-between;
      box-shadow: 0 6px 16px rgba(0,0,0,.05);
    }
    .tileLeft{ min-width:0; }
    .tileTitle{ font-weight:800; margin:0; }
    .tileSub{ color:var(--muted); margin:6px 0 0; font-size:13px; line-height:1.3; }
    .tileRight{ display:flex; gap:10px; align-items:center; justify-content:flex-end; flex-shrink:0; flex-wrap:wrap; }

    .divider{ height:1px; background:var(--line); margin:16px 0; }

    .grid2{ display:grid; grid-template-columns:1fr; gap:12px; }
    .grid3{ display:grid; grid-template-columns:1fr; gap:12px; }
    @media (min-width: 820px){
      .grid2{ grid-template-columns:1fr 1fr; }
      .grid3{ grid-template-columns:1fr 1fr 1fr; }
    }

    .lbl{
      display:block;
      font-size:12px;
      color:var(--muted);
      margin:0 0 6px;
      font-weight:700;
      letter-spacing:.2px;
    }
    .inp{
      width:100%;
      border:1px solid var(--line);
      border-radius:12px;
      padding:12px 12px;
      font-size:14px;
      outline:none;
      background:#fff;
    }
    textarea.inp{ resize:vertical; }

    .checkGrid{
      display:grid;
      grid-template-columns:1fr;
      gap:10px;
    }
    @media (min-width: 820px){
      .checkGrid{ grid-template-columns:1fr 1fr; }
    }
    .tickRow{
      display:flex;
      align-items:flex-start;
      gap:10px;
      padding:10px 12px;
      border:1px solid var(--line);
      border-radius:12px;
      background:#fff;
    }
    .tickRow input{ margin-top:2px; transform:scale(1.15); }

    .msg{
      margin:12px 0 0;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid var(--line);
      background:#fff;
      font-size:13px;
    }
    .msgOk{ border-color:#bbf7d0; background:#f0fdf4; }
    .msgErr{ border-color:#fecaca; background:#fef2f2; }

    .muted{ color:var(--muted); font-size:13px; }

    .foot{
      text-align:center;
      color:var(--muted);
      font-size:12px;
      padding:14px 0 4px;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      padding:6px 10px;
      border-radius:999px;
      background: rgba(255,214,0,.22);
      border:1px solid rgba(255,214,0,.45);
      font-weight:800;
      font-size:12px;
      color:#111;
      letter-spacing:.2px;
      max-width: 45vw;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
</head>

<body>
  <header class="topbar">
    <div class="topbarInner">
      <div class="brand">
        <div class="badge">RF</div>
        <div style="min-width:0;">
          <div class="brandTitle">Red Folder ATL</div>
          <div class="brandSub" id="subTitle">Select a project</div>
        </div>
      </div>

      <div class="rightTools">
        <span class="pill" id="projectPill" title="Current project">No project</span>
        <a class="btnGhost" href="#history">History</a>
        <span class="pill" id="buildTag">BUILD</span>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div id="app"></div>
    <div class="foot" id="footTag"></div>
  </main>

  <script src="./app.js"></script>
</body>
</html>
