name: HTML Lint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  html-lint:
    name: Lint HTML files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '18'

      - name: Install htmlhint
        run: npm install -g htmlhint

      - name: Run htmlhint on public/**/*.html
        run: |
          shopt -s globstar nullglob
          files=(public/**/*.html)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No HTML files to lint"
          else
            htmlhint "${files[@]}"
          fi
